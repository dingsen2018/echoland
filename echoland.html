<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Echoland 回声地</title>
  <style>
    :root {
      --u: min(calc(100vw / 375), 1px);
      --bg: #05080d;
      --surface: #090d13;
      --surface-soft: #11161d;
      --border: rgba(255, 255, 255, .12);
      --text-main: #ffffff;
      --text-sub: #9da1a8;
      --brand: #a8ff3d;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #05080d;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      width: min(100vw, calc(430 * var(--u)));
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    .app-main {
      min-height: 100vh;
      padding-bottom: calc(86 * var(--u) + env(safe-area-inset-bottom));
    }

    .tab-panel {
      display: none;
      min-height: calc(100vh - calc(86 * var(--u)));
      background: var(--bg);
    }

    .tab-panel.active {
      display: block;
    }

    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(100vw, calc(430 * var(--u)));
      padding: calc(7 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u) + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255, 255, 255, .08);
      background: rgba(5, 8, 13, .94);
      backdrop-filter: blur(calc(18 * var(--u)));
      transform: translateX(-50%);
    }

    .tab-btn {
      display: grid;
      justify-items: center;
      align-items: center;
      min-height: calc(58 * var(--u));
      border-radius: calc(18 * var(--u));
      background: transparent;
      color: var(--text-sub);
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }

    .tab-icon {
      position: relative;
      width: calc(36 * var(--u));
      height: calc(36 * var(--u));
    }

    .tab-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity .18s ease, transform .18s ease;
    }

    .tab-icon .icon-active {
      opacity: 0;
    }

    .tab-btn.active .icon-default {
      opacity: 0;
    }

    .tab-btn.active .icon-active {
      opacity: 1;
    }

    .tab-btn span {
      font-size: calc(11 * var(--u));
      line-height: 1;
    }

    .tab-btn.active {
      color: var(--brand);
      background: transparent;
    }

    .tab-btn:active {
      transform: scale(.96);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div id="tab-home" class="tab-panel active">
<section class="home-page">
  <style>
    .home-page {
      padding: calc(26 * var(--u)) calc(18 * var(--u)) 0;
    }

    .home-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(16 * var(--u));
    }

    .home-logo {
      display: block;
      width: calc(146 * var(--u));
      height: auto;
    }

    .home-location {
      display: inline-flex;
      align-items: center;
      gap: calc(7 * var(--u));
      min-height: calc(34 * var(--u));
      padding: 0;
      background: transparent;
      color: var(--text-main);
      font-size: calc(16 * var(--u));
      font-weight: 600;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .home-location-pin {
      display: grid;
      place-items: center;
      width: calc(20 * var(--u));
      height: calc(20 * var(--u));
      color: var(--brand);
    }

    .home-location-pin svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .home-location-arrow {
      width: calc(8 * var(--u));
      height: calc(8 * var(--u));
      border-right: calc(2 * var(--u)) solid rgba(255, 255, 255, .86);
      border-bottom: calc(2 * var(--u)) solid rgba(255, 255, 255, .86);
      transform: rotate(45deg) translateY(calc(-2 * var(--u)));
    }
  </style>

  <header class="home-topbar">
    <img class="home-logo" src="assets/icons/app-logo.png" alt="Echoland 回声地">
    <button class="home-location" type="button" aria-label="当前城市：南京">
      <span class="home-location-pin" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.8A2.8 2.8 0 1 1 12 6a2.8 2.8 0 0 1 0 5.8Z"/></svg>
      </span>
      <span>南京</span>
      <span class="home-location-arrow" aria-hidden="true"></span>
    </button>
  </header>
</section>

      </div>
      <div id="tab-route" class="tab-panel">


      </div>
      <div id="tab-community" class="tab-panel">


      </div>
      <div id="tab-mine" class="tab-panel">


      </div>
    </main>

    <nav class="bottom-tabs" aria-label="底部导航">
      <button class="tab-btn active" data-tab="tab-home" type="button" aria-label="首页">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/home.png" alt="">
          <img class="icon-active" src="assets/icons/home-active.png" alt="">
        </span>
      </button>
      <button class="tab-btn" data-tab="tab-route" type="button" aria-label="AI 路线">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/route.png" alt="">
          <img class="icon-active" src="assets/icons/route-active.png" alt="">
        </span>
      </button>
      <button class="tab-btn" data-tab="tab-community" type="button" aria-label="社区">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/community.png" alt="">
          <img class="icon-active" src="assets/icons/community-active.png" alt="">
        </span>
      </button>
      <button class="tab-btn" data-tab="tab-mine" type="button" aria-label="我的">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/mine.png" alt="">
          <img class="icon-active" src="assets/icons/mine-active.png" alt="">
        </span>
      </button>
    </nav>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === tabId);
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
  </script>
</body>
</html>
