<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Echoland 回声地</title>
  <script src="scripts/mock-data.js"></script>
  <script src="scripts/mapService.js"></script>
  <style>
    :root {
      --u: min(calc(100vw / 375), 1px);
      --bg: #05080d;
      --surface: #090d13;
      --surface-soft: #11161d;
      --border: rgba(255, 255, 255, .12);
      --text-main: #ffffff;
      --text-sub: #9da1a8;
      --brand: #a8ff3d;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #05080d;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      width: min(100vw, calc(430 * var(--u)));
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
    }

    .app-main {
      min-height: 100vh;
      padding-bottom: calc(86 * var(--u) + env(safe-area-inset-bottom));
    }

    .tab-panel {
      display: none;
      min-height: calc(100vh - calc(86 * var(--u)));
      background: var(--bg);
    }

    .tab-panel.active {
      display: block;
    }

    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(100vw, calc(430 * var(--u)));
      padding: calc(7 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u) + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255, 255, 255, .08);
      background: rgba(5, 8, 13, .94);
      backdrop-filter: blur(calc(18 * var(--u)));
      transform: translateX(-50%);
    }

    .tab-btn {
      display: grid;
      justify-items: center;
      align-items: center;
      min-height: calc(58 * var(--u));
      border-radius: calc(18 * var(--u));
      background: transparent;
      color: var(--text-sub);
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }

    .tab-icon {
      position: relative;
      width: calc(36 * var(--u));
      height: calc(36 * var(--u));
    }

    .tab-icon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity .18s ease, transform .18s ease;
    }

    .tab-icon .icon-active {
      opacity: 0;
    }

    .tab-btn.active .icon-default {
      opacity: 0;
    }

    .tab-btn.active .icon-active {
      opacity: 1;
    }

    .tab-btn span {
      font-size: calc(11 * var(--u));
      line-height: 1;
    }

    .tab-btn.active {
      color: var(--brand);
      background: transparent;
    }

    .tab-btn:active {
      transform: scale(.96);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div id="tab-home" class="tab-panel active">
<section class="home-page">
  <style>
    .home-page {
      padding: calc(26 * var(--u)) calc(18 * var(--u)) 0;
      color: var(--text-main);
    }

    /* ---------- 顶部品牌区 ---------- */
    .home-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(16 * var(--u));
      margin-bottom: calc(18 * var(--u));
    }

    .home-logo {
      display: block;
      width: calc(146 * var(--u));
      height: auto;
    }

    .home-location {
      display: inline-flex;
      align-items: center;
      gap: calc(7 * var(--u));
      min-height: calc(34 * var(--u));
      padding: 0;
      background: transparent;
      color: var(--text-main);
      font-size: calc(16 * var(--u));
      font-weight: 600;
      white-space: nowrap;
    }

    .home-location-pin {
      display: grid;
      place-items: center;
      width: calc(20 * var(--u));
      height: calc(20 * var(--u));
      color: var(--brand);
    }

    .home-location-pin svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .home-location-arrow {
      width: calc(8 * var(--u));
      height: calc(8 * var(--u));
      border-right: calc(2 * var(--u)) solid rgba(255, 255, 255, .86);
      border-bottom: calc(2 * var(--u)) solid rgba(255, 255, 255, .86);
      transform: rotate(45deg) translateY(calc(-2 * var(--u)));
    }

    /* ---------- 搜索栏 ---------- */
    .home-search {
      position: relative;
      margin-bottom: calc(18 * var(--u));
    }

    .home-search-input {
      width: 100%;
      height: calc(46 * var(--u));
      padding: 0 calc(80 * var(--u)) 0 calc(44 * var(--u));
      border: 1px solid var(--border);
      border-radius: calc(23 * var(--u));
      background: var(--surface-soft);
      color: var(--text-main);
      font-size: calc(14 * var(--u));
      outline: none;
    }

    .home-search-input::placeholder {
      color: var(--text-sub);
    }

    .home-search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 calc(3 * var(--u)) rgba(168, 255, 61, .12);
    }

    .home-search-icon {
      position: absolute;
      left: calc(16 * var(--u));
      top: 50%;
      width: calc(18 * var(--u));
      height: calc(18 * var(--u));
      color: var(--text-sub);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .home-search-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .home-search-actions {
      position: absolute;
      right: calc(12 * var(--u));
      top: 50%;
      display: flex;
      align-items: center;
      gap: calc(8 * var(--u));
      transform: translateY(-50%);
    }

    .home-search-action {
      display: grid;
      place-items: center;
      width: calc(28 * var(--u));
      height: calc(28 * var(--u));
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-sub);
    }

    .home-search-action svg {
      width: calc(20 * var(--u));
      height: calc(20 * var(--u));
      fill: currentColor;
    }

    /* ---------- 分类筛选 ---------- */
    .home-categories {
      display: flex;
      gap: calc(10 * var(--u));
      margin-bottom: calc(18 * var(--u));
      overflow-x: auto;
      padding-bottom: calc(4 * var(--u));
      scrollbar-width: none;
    }

    .home-categories::-webkit-scrollbar {
      display: none;
    }

    .home-category {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: calc(6 * var(--u));
      height: calc(36 * var(--u));
      padding: 0 calc(14 * var(--u));
      border: 1px solid var(--border);
      border-radius: calc(18 * var(--u));
      background: var(--surface);
      color: var(--text-sub);
      font-size: calc(13 * var(--u));
      font-weight: 500;
      transition: all .18s ease;
    }

    .home-category svg {
      width: calc(16 * var(--u));
      height: calc(16 * var(--u));
      fill: currentColor;
    }

    .home-category.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #05080d;
      box-shadow: 0 calc(4 * var(--u)) calc(14 * var(--u)) rgba(168, 255, 61, .24);
    }

    .home-category:active {
      transform: scale(.96);
    }

    .home-filter-btn {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: calc(36 * var(--u));
      height: calc(36 * var(--u));
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-sub);
      margin-left: auto;
    }

    .home-filter-btn svg {
      width: calc(18 * var(--u));
      height: calc(18 * var(--u));
      fill: currentColor;
    }

    /* ---------- 时间筛选浮层 ---------- */
    .home-time-sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      background: rgba(0, 0, 0, .6);
    }

    .home-time-sheet.open {
      display: flex;
    }

    .home-time-sheet-body {
      padding: calc(20 * var(--u)) calc(18 * var(--u)) calc(24 * var(--u));
      border-radius: calc(24 * var(--u)) calc(24 * var(--u)) 0 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform .25s ease;
    }

    .home-time-sheet.open .home-time-sheet-body {
      transform: translateY(0);
    }

    .home-time-sheet-title {
      margin: 0 0 calc(16 * var(--u));
      font-size: calc(17 * var(--u));
      font-weight: 700;
    }

    .home-time-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: calc(10 * var(--u));
      margin-bottom: calc(18 * var(--u));
    }

    .home-time-option {
      height: calc(44 * var(--u));
      border: 1px solid var(--border);
      border-radius: calc(12 * var(--u));
      background: var(--surface-soft);
      color: var(--text-sub);
      font-size: calc(14 * var(--u));
      font-weight: 500;
      transition: all .18s ease;
    }

    .home-time-option.active {
      border-color: var(--brand);
      background: rgba(168, 255, 61, .14);
      color: var(--brand);
    }

    .home-time-confirm {
      width: 100%;
      height: calc(48 * var(--u));
      border: 0;
      border-radius: calc(24 * var(--u));
      background: var(--brand);
      color: #05080d;
      font-size: calc(15 * var(--u));
      font-weight: 600;
    }

    /* ---------- 地图区域 ---------- */
    .home-map-wrap {
      position: relative;
      margin-bottom: calc(16 * var(--u));
    }

    .home-map {
      position: relative;
      height: calc(300 * var(--u));
      border-radius: calc(20 * var(--u));
      overflow: hidden;
      background:
        radial-gradient(circle at 25% 30%, rgba(168, 255, 61, .08), transparent 40%),
        radial-gradient(circle at 75% 65%, rgba(120, 80, 220, .10), transparent 45%),
        linear-gradient(180deg, #0d131d 0%, #070b11 100%);
      border: 1px solid var(--border);
      box-shadow: inset 0 0 calc(50 * var(--u)) rgba(0, 0, 0, .5);
    }

    .home-map-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
      background-size: calc(36 * var(--u)) calc(36 * var(--u));
      mask-image: radial-gradient(ellipse at center, black 45%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 45%, transparent 90%);
    }

    .home-map-district {
      position: absolute;
      font-size: calc(12 * var(--u));
      color: rgba(157, 161, 168, .55);
      font-weight: 500;
      pointer-events: none;
    }

    .home-map-pin {
      position: absolute;
      display: flex;
      align-items: center;
      gap: calc(6 * var(--u));
      padding: calc(7 * var(--u)) calc(11 * var(--u));
      border-radius: calc(14 * var(--u));
      background: rgba(9, 13, 19, .88);
      border: 1px solid rgba(168, 255, 61, .35);
      box-shadow: 0 calc(4 * var(--u)) calc(14 * var(--u)) rgba(0, 0, 0, .35);
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: all .2s ease;
      max-width: calc(160 * var(--u));
      z-index: 1;
    }

    .home-map-pin.active {
      z-index: 2;
      background: var(--brand);
      border-color: var(--brand);
      box-shadow: 0 0 calc(18 * var(--u)) rgba(168, 255, 61, .6);
    }

    .home-map-pin.active .home-map-pin-icon {
      background: rgba(5, 8, 13, .2);
      color: #05080d;
    }

    .home-map-pin.active .home-map-pin-title,
    .home-map-pin.active .home-map-pin-time {
      color: #05080d;
    }

    .home-map-pin::after {
      content: '';
      position: absolute;
      bottom: calc(-7 * var(--u));
      left: 50%;
      width: calc(8 * var(--u));
      height: calc(8 * var(--u));
      background: rgba(9, 13, 19, .88);
      border-right: 1px solid rgba(168, 255, 61, .35);
      border-bottom: 1px solid rgba(168, 255, 61, .35);
      transform: translateX(-50%) rotate(45deg);
      transition: background .2s ease, border-color .2s ease;
    }

    .home-map-pin.active::after {
      background: var(--brand);
      border-color: var(--brand);
    }

    .home-map-pin-icon {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: calc(24 * var(--u));
      height: calc(24 * var(--u));
      border-radius: 50%;
      background: rgba(168, 255, 61, .16);
      color: var(--brand);
      transition: all .2s ease;
    }

    .home-map-pin-icon svg {
      width: calc(14 * var(--u));
      height: calc(14 * var(--u));
      fill: currentColor;
    }

    .home-map-pin-text {
      display: flex;
      flex-direction: column;
      gap: calc(2 * var(--u));
      overflow: hidden;
    }

    .home-map-pin-title {
      font-size: calc(12 * var(--u));
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .2s ease;
    }

    .home-map-pin-time {
      font-size: calc(10 * var(--u));
      color: var(--text-sub);
      transition: color .2s ease;
    }

    /* ---------- 活动简卡 ---------- */
    .home-brief-card {
      display: none;
      align-items: center;
      gap: calc(12 * var(--u));
      margin-top: calc(12 * var(--u));
      padding: calc(12 * var(--u));
      border-radius: calc(16 * var(--u));
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .18s ease;
    }

    .home-brief-card:active {
      transform: scale(.99);
    }

    .home-brief-card.show {
      display: flex;
    }

    .home-brief-thumb {
      flex-shrink: 0;
      width: calc(72 * var(--u));
      height: calc(72 * var(--u));
      border-radius: calc(12 * var(--u));
      overflow: hidden;
      background: var(--surface-soft);
    }

    .home-brief-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .home-brief-info {
      flex: 1;
      min-width: 0;
    }

    .home-brief-title {
      margin: 0 0 calc(6 * var(--u));
      font-size: calc(15 * var(--u));
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .home-brief-meta {
      display: flex;
      flex-wrap: wrap;
      gap: calc(6 * var(--u));
      margin-bottom: calc(8 * var(--u));
      font-size: calc(12 * var(--u));
      color: var(--text-sub);
    }

    .home-brief-tag {
      padding: calc(3 * var(--u)) calc(8 * var(--u));
      border-radius: calc(8 * var(--u));
      background: rgba(168, 255, 61, .12);
      color: var(--brand);
      font-size: calc(11 * var(--u));
      font-weight: 600;
    }

    .home-brief-btn {
      flex-shrink: 0;
      height: calc(34 * var(--u));
      padding: 0 calc(16 * var(--u));
      border: 0;
      border-radius: calc(17 * var(--u));
      background: var(--brand);
      color: #05080d;
      font-size: calc(13 * var(--u));
      font-weight: 600;
    }

    /* ---------- 精选活动 ---------- */
    .home-section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: calc(14 * var(--u));
    }

    .home-section-title h2 {
      margin: 0;
      font-size: calc(18 * var(--u));
      font-weight: 700;
    }

    .home-section-more {
      display: inline-flex;
      align-items: center;
      gap: calc(4 * var(--u));
      font-size: calc(13 * var(--u));
      color: var(--text-sub);
    }

    .home-section-more::after {
      content: '';
      width: calc(6 * var(--u));
      height: calc(6 * var(--u));
      border-right: calc(1.5 * var(--u)) solid currentColor;
      border-bottom: calc(1.5 * var(--u)) solid currentColor;
      transform: rotate(-45deg);
    }

    .home-featured {
      display: flex;
      gap: calc(12 * var(--u));
      overflow-x: auto;
      padding-bottom: calc(20 * var(--u));
      margin: 0 calc(-18 * var(--u));
      padding-left: calc(18 * var(--u));
      padding-right: calc(18 * var(--u));
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }

    .home-featured::-webkit-scrollbar {
      display: none;
    }

    .event-card {
      flex: 0 0 auto;
      width: calc(260 * var(--u));
      border-radius: calc(18 * var(--u));
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      scroll-snap-align: start;
      transition: transform .18s ease;
      cursor: pointer;
    }

    .event-card:active {
      transform: scale(.98);
    }

    .event-card-cover {
      position: relative;
      width: 100%;
      height: calc(150 * var(--u));
      overflow: hidden;
    }

    .event-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .event-card-badge {
      position: absolute;
      top: calc(10 * var(--u));
      left: calc(10 * var(--u));
      padding: calc(4 * var(--u)) calc(8 * var(--u));
      border-radius: calc(8 * var(--u));
      background: rgba(168, 255, 61, .18);
      color: var(--brand);
      font-size: calc(10 * var(--u));
      font-weight: 600;
      border: 1px solid rgba(168, 255, 61, .3);
    }

    .event-card-fav {
      position: absolute;
      top: calc(10 * var(--u));
      right: calc(10 * var(--u));
      display: grid;
      place-items: center;
      width: calc(28 * var(--u));
      height: calc(28 * var(--u));
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(5, 8, 13, .5);
      color: #fff;
      backdrop-filter: blur(calc(4 * var(--u)));
    }

    .event-card-fav svg {
      width: calc(16 * var(--u));
      height: calc(16 * var(--u));
      fill: currentColor;
    }

    .event-card-fav.active svg {
      fill: var(--brand);
    }

    .event-card-body {
      padding: calc(12 * var(--u)) calc(14 * var(--u)) calc(14 * var(--u));
    }

    .event-card-title {
      margin: 0 0 calc(8 * var(--u));
      font-size: calc(15 * var(--u));
      font-weight: 600;
      line-height: 1.3;
    }

    .event-card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: calc(6 * var(--u));
      margin-bottom: calc(8 * var(--u));
      font-size: calc(12 * var(--u));
      color: var(--text-sub);
    }

    .event-card-meta svg {
      width: calc(12 * var(--u));
      height: calc(12 * var(--u));
      fill: currentColor;
      flex-shrink: 0;
    }

    .event-card-meta .price-free {
      color: var(--brand);
      font-weight: 600;
    }

    .event-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: calc(6 * var(--u));
    }

    .event-card-tag-item {
      padding: calc(4 * var(--u)) calc(8 * var(--u));
      border-radius: calc(8 * var(--u));
      background: var(--surface-soft);
      color: var(--text-sub);
      font-size: calc(11 * var(--u));
    }

    /* ---------- 空状态 ---------- */
    .home-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(32 * var(--u)) calc(18 * var(--u));
      color: var(--text-sub);
      text-align: center;
    }

    .home-empty-icon {
      width: calc(48 * var(--u));
      height: calc(48 * var(--u));
      margin-bottom: calc(12 * var(--u));
      color: var(--brand);
      opacity: .6;
    }

    .home-empty-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .home-empty-title {
      margin: 0 0 calc(6 * var(--u));
      font-size: calc(15 * var(--u));
      font-weight: 600;
      color: var(--text-main);
    }

    .home-empty-desc {
      margin: 0;
      font-size: calc(13 * var(--u));
    }
  </style>

  <header class="home-topbar">
    <img class="home-logo" src="assets/icons/app-logo.png" alt="Echoland 回声地">
    <button class="home-location" type="button" aria-label="当前城市：南京">
      <span class="home-location-pin" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.8A2.8 2.8 0 1 1 12 6a2.8 2.8 0 0 1 0 5.8Z"/></svg>
      </span>
      <span>南京</span>
      <span class="home-location-arrow" aria-hidden="true"></span>
    </button>
  </header>

  <div class="home-search">
    <span class="home-search-icon" aria-hidden="true">

  <div class="home-map-wrap">

        <div class="home-brief-meta">
          <span id="briefTime"></span>
          <span>|</span>
          <span id="briefLocation"></span>
          <span id="briefPrice"></span>
        </div>
        <span class="home-brief-tag" id="briefTag"></span>

  <div class="home-section-title">
    <h2>精选活动</h2>
    <span class="home-section-more">全部活动</span>

  <div class="home-featured" id="homeFeatured"></div>

  <div class="home-time-sheet" id="timeSheet" aria-hidden="true">
    <div class="home-time-sheet-body">
      <h3 class="home-time-sheet-title">选择时间</h3>
      <div class="home-time-options" role="tablist" aria-label="时间选项">
        <button class="home-time-option active" type="button" data-time="all" role="tab" aria-selected="true">全部</button>
        <button class="home-time-option" type="button" data-time="tonight" role="tab" aria-selected="false">今晚</button>
        <button class="home-time-option" type="button" data-time="tomorrow" role="tab" aria-selected="false">明天</button>
        <button class="home-time-option" type="button" data-time="weekend" role="tab" aria-selected="false">周末</button>
        <button class="home-time-option" type="button" data-time="thisWeek" role="tab" aria-selected="false">本周</button>
        <button class="home-time-option" type="button" data-time="custom" role="tab" aria-selected="false">自定义</button>
      </div>
      <button class="home-time-confirm" type="button" id="timeConfirmBtn">确定</button>
    </div>
  </div>
</section>

<script>
  (function () {
    'use strict';

    document.addEventListener('DOMContentLoaded', function () {
      const allEvents = (typeof window !== 'undefined' && window.MOCK_EVENTS) ? window.MOCK_EVENTS : [];
      let currentCategory = '音乐';
      let currentTimeGroup = 'all';
      let pendingTimeGroup = 'all';
      let selectedEventId = null;

      const categoryIcons = {
        '音乐': '<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6Z"/></svg>',
        '展览': '<svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Zm0 16H3V5h18v14ZM5 7h14v2H5V7Zm0 4h8v2H5v-2Z"/></svg>',
        '放映': '<svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6Zm0 5h10v2H4v-2Zm0 5h16v2H4v-2Zm14-7 4 3-4 3V9Z"/></svg>',
        '市集': '<svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2Zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3Zm7 17H5V8h14v12Zm-7-8c-1.66 0-3-1.34-3-3h2c0 .55.45 1 1 1s1-.45 1-1h2c0 1.66-1.34 3-3 3Z"/></svg>',
        '夜游': '<svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Zm0 16a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>'
      };

      // 分类切换
      document.querySelectorAll('.home-category').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.dataset.category;
          if (!cat) return;
          currentCategory = cat;
          document.querySelectorAll('.home-category').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          hideBriefCard();
          updateView();
        });
      });

      // 展开时间筛选浮层
      const filterExpandBtn = document.getElementById('filterExpandBtn');
      const timeSheet = document.getElementById('timeSheet');
      const timeConfirmBtn = document.getElementById('timeConfirmBtn');

      if (filterExpandBtn && timeSheet) {
        filterExpandBtn.addEventListener('click', () => {
          pendingTimeGroup = currentTimeGroup;
          document.querySelectorAll('.home-time-option').forEach(b => {
            b.classList.toggle('active', b.dataset.time === pendingTimeGroup);
            b.setAttribute('aria-selected', b.dataset.time === pendingTimeGroup ? 'true' : 'false');
          });
          timeSheet.classList.add('open');
          timeSheet.setAttribute('aria-hidden', 'false');
        });

        timeSheet.addEventListener('click', e => {
          if (e.target === timeSheet) {
            timeSheet.classList.remove('open');
            timeSheet.setAttribute('aria-hidden', 'true');
          }
        });
      }

      // 时间选项切换
      document.querySelectorAll('.home-time-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const time = btn.dataset.time;
          if (time === 'custom') {
            alert('自定义日期选择器即将上线');
            return;
          }
          pendingTimeGroup = time;
          document.querySelectorAll('.home-time-option').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
        });
      });

      // 确定时间筛选
      if (timeConfirmBtn) {
        timeConfirmBtn.addEventListener('click', () => {
          currentTimeGroup = pendingTimeGroup;
          timeSheet.classList.remove('open');
          timeSheet.setAttribute('aria-hidden', 'true');
          hideBriefCard();
          updateView();
        });
      }

      function getFilteredEvents() {
        return allEvents.filter(evt => {
          const matchCategory = evt.category === currentCategory;
          const matchTime = currentTimeGroup === 'all' || evt.timeGroup === currentTimeGroup;
          return matchCategory && matchTime;
        });
      }

      function findEvent(id) {
        return allEvents.find(evt => evt.id === id);
      }

      function formatPinTime(startTime) {
        const d = new Date(startTime.replace(' ', 'T'));
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${hh}:${mm} 开始`;
      }

      function formatCardTime(startTime) {
        const start = new Date(startTime.replace(' ', 'T'));
        const weekday = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][start.getDay()];
        return `${weekday} ${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`;
      }

      function goToDetail(id) {
        window.CURRENT_EVENT_ID = id;
        if (typeof window.switchTab === 'function') {
          window.switchTab('tab-event-detail');
        }
        if (typeof window.renderEventDetail === 'function') {
          window.renderEventDetail();
        }
      }

      function renderMapPins(events) {
        const container = document.querySelector('.home-map-pins');
        if (!container) return;

        container.innerHTML = '';
        if (!events.length) return;

        const lats = allEvents.map(e => e.latitude);
        const lngs = allEvents.map(e => e.longitude);
        const minLat = Math.min(...lats), maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
        const padLat = (maxLat - minLat) * 0.2 || 0.01;
        const padLng = (maxLng - minLng) * 0.2 || 0.01;

        events.forEach(evt => {
          const top = 12 + 76 * (1 - (evt.latitude - minLat + padLat) / (maxLat - minLat + padLat * 2));
          const left = 12 + 76 * (evt.longitude - minLng + padLng) / (maxLng - minLng + padLng * 2);
          const iconSvg = categoryIcons[evt.category] || categoryIcons['音乐'];
          const pin = document.createElement('div');
          pin.className = 'home-map-pin';
          pin.dataset.id = evt.id;
          pin.style.top = top + '%';
          pin.style.left = left + '%';
          pin.innerHTML = `
            <span class="home-map-pin-icon" aria-hidden="true">${iconSvg}</span>
            <span class="home-map-pin-text">
              <span class="home-map-pin-title">${evt.title}</span>
              <span class="home-map-pin-time">${formatPinTime(evt.startTime)}</span>
            </span>
          `;
          pin.addEventListener('click', () => selectEvent(evt.id));
          container.appendChild(pin);
        });
      }

      // 活动简卡
      const briefCard = document.getElementById('homeBriefCard');
      const briefThumb = document.getElementById('briefThumb');
      const briefTitle = document.getElementById('briefTitle');
      const briefTime = document.getElementById('briefTime');
      const briefLocation = document.getElementById('briefLocation');
      const briefPrice = document.getElementById('briefPrice');
      const briefTag = document.getElementById('briefTag');
      const briefDetailBtn = document.getElementById('briefDetailBtn');

      function hideBriefCard() {
        if (briefCard) briefCard.classList.remove('show');
        selectedEventId = null;
        document.querySelectorAll('.home-map-pin').forEach(p => p.classList.remove('active'));
      }

      function selectEvent(id) {
        const evt = findEvent(id);
        if (!evt) return;

        selectedEventId = id;

        document.querySelectorAll('.home-map-pin').forEach(p => {
          p.classList.toggle('active', p.dataset.id === id);
        });

        if (briefCard) {
          briefCard.dataset.id = id;
          briefThumb.src = evt.cover;
          briefThumb.alt = evt.title;
          briefTitle.textContent = evt.title;
          briefTime.textContent = formatCardTime(evt.startTime);
          briefLocation.textContent = evt.district;
          briefPrice.textContent = evt.price === '免费' ? '免费' : '¥' + evt.price;
          briefTag.textContent = evt.category;
          briefCard.classList.add('show');
        }
      }

      if (briefCard) {
        briefCard.addEventListener('click', e => {
          if (e.target.closest('.home-brief-btn')) return;
          if (selectedEventId) goToDetail(selectedEventId);
        });
      }

      if (briefDetailBtn) {
        briefDetailBtn.addEventListener('click', () => {
          if (selectedEventId) goToDetail(selectedEventId);
        });
      }

      function isStartingSoon(startTime) {
        const now = new Date('2026-06-21T18:00:00');
        const start = new Date(startTime.replace(' ', 'T'));
        const diffHours = (start - now) / (1000 * 60 * 60);
        return diffHours >= 0 && diffHours <= 6;
      }

      function renderFeaturedCards(events) {
        const container = document.getElementById('homeFeatured');
        if (!container) return;

        if (!events.length) {
          container.innerHTML = `
            <div class="home-empty">
              <span class="home-empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8Zm-1-13h2v6h-2Zm0 8h2v2h-2Z"/></svg>
              </span>
              <p class="home-empty-title">暂无符合条件的活动</p>
              <p class="home-empty-desc">换个分类或时间，继续探索城市</p>
            </div>
          `;
          return;
        }

        container.innerHTML = events.map(evt => {
          const soonBadge = isStartingSoon(evt.startTime) ? '<span class="event-card-badge">即将开始</span>' : '';
          const tagsHtml = (evt.tags || []).slice(0, 3).map(t => `<span class="event-card-tag-item">${t}</span>`).join('');
          const priceClass = evt.price === '免费' ? 'price-free' : '';
          const priceText = evt.price === '免费' ? '免费' : '¥' + evt.price;

          return `
            <article class="event-card" data-id="${evt.id}">
              <div class="event-card-cover">
                <img src="${evt.cover}" alt="${evt.title}">
                ${soonBadge}
                <button class="event-card-fav" type="button" aria-label="收藏" data-id="${evt.id}">
                  <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
                </button>
              </div>
              <div class="event-card-body">
                <h3 class="event-card-title">${evt.title}</h3>
                <div class="event-card-meta">
                  <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 16H5V9h14v11Z"/></svg>
                  <span>${formatCardTime(evt.startTime)}</span>
                  <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"/></svg>
                  <span>${evt.district}</span>
                  <span class="${priceClass}">${priceText}</span>
                </div>
                <div class="event-card-tags">${tagsHtml}</div>
              </div>
            </article>
          `;
        }).join('');

        container.querySelectorAll('.event-card-fav').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            btn.classList.toggle('active');
          });
        });

        container.querySelectorAll('.event-card').forEach(card => {
          card.addEventListener('click', () => goToDetail(card.dataset.id));
        });
      }

      function updateView() {
        const filtered = getFilteredEvents();
        renderMapPins(filtered);
        renderFeaturedCards(filtered);
      }

      updateView();
    });
  })();
</script>

      </div>

<section class="event-detail-page">
  <style>
    .event-detail-page {
      position: relative;
      min-height: 100vh;
      padding-bottom: calc(90 * var(--u));
      color: var(--text-main);
      background: var(--bg);
    }

    /* ---------- 顶部导航 ---------- */
    .detail-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14 * var(--u)) calc(18 * var(--u));
      background: rgba(5, 8, 13, .92);
      backdrop-filter: blur(calc(12 * var(--u)));
      border-bottom: 1px solid var(--border);
    }

    .detail-back,
    .detail-share {
      display: grid;
      place-items: center;
      width: calc(36 * var(--u));
      height: calc(36 * var(--u));
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-main);
      transition: transform .18s ease;
    }

    .detail-back:active,
    .detail-share:active {
      transform: scale(.94);
    }

    .detail-back svg,
    .detail-share svg {
      width: calc(20 * var(--u));
      height: calc(20 * var(--u));
      fill: currentColor;
    }

    .detail-logo {
      height: calc(22 * var(--u));
      width: auto;
    }

    /* ---------- 内容区 ---------- */
    .detail-body {
      padding: calc(18 * var(--u));
    }

    .detail-cover {
      position: relative;
      width: 100%;
      height: calc(260 * var(--u));
      border-radius: calc(20 * var(--u));
      overflow: hidden;
      margin-bottom: calc(20 * var(--u));
      background: var(--surface-soft);
    }

    .detail-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-category {
      position: absolute;
      top: calc(14 * var(--u));
      left: calc(14 * var(--u));
      padding: calc(5 * var(--u)) calc(12 * var(--u));

      background: rgba(168, 255, 61, .18);

    .detail-title {
      margin: 0 0 calc(16 * var(--u));
      font-size: calc(24 * var(--u));
      font-weight: 700;
      line-height: 1.3;
    }

    /* ---------- 信息卡片 ---------- */
    .detail-info-card {
      padding: calc(16 * var(--u));
      border-radius: calc(18 * var(--u));
      background: var(--surface);
      border: 1px solid var(--border);

    }

    .detail-info-row {
      display: flex;
      align-items: flex-start;
      gap: calc(12 * var(--u));

    .detail-info-icon {

      place-items: center;

      height: calc(34 * var(--u));
      border-radius: 50%;
      background: rgba(168, 255, 61, .12);
      color: var(--brand);
    }

    .detail-info-icon svg {
      width: calc(18 * var(--u));
      height: calc(18 * var(--u));
      fill: currentColor;
    }

    .detail-info-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: calc(4 * var(--u));
    }

    .detail-info-label {
      font-size: calc(12 * var(--u));
      color: var(--text-sub);
    }

    .detail-info-value {
      font-size: calc(15 * var(--u));
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
    }

    .detail-info-value.price {
      color: var(--brand);
    }

    /* ---------- 标签 ---------- */
    .detail-section {
      margin-bottom: calc(24 * var(--u));
    }

    .detail-section-title {
      margin: 0 0 calc(12 * var(--u));
      font-size: calc(17 * var(--u));
      font-weight: 700;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: calc(10 * var(--u));
    }

    .detail-tag {
      padding: calc(6 * var(--u)) calc(14 * var(--u));
      border-radius: calc(20 * var(--u));
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: calc(13 * var(--u));
    }

    /* ---------- 活动简介 ---------- */
    .detail-desc {
      font-size: calc(14 * var(--u));
      line-height: 1.8;
      color: var(--text-sub);
      white-space: pre-line;
    }

    /* ---------- 推荐理由 ---------- */
    .detail-reasons {
      display: flex;
      flex-direction: column;
      gap: calc(10 * var(--u));
    }

    .detail-reason {
      display: flex;
      align-items: flex-start;
      gap: calc(10 * var(--u));
      padding: calc(12 * var(--u)) calc(14 * var(--u));
      border-radius: calc(14 * var(--u));
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: calc(14 * var(--u));
      color: var(--text-sub);
    }

    .detail-reason-dot {
      flex-shrink: 0;
      width: calc(8 * var(--u));
      height: calc(8 * var(--u));
      margin-top: calc(7 * var(--u));
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 calc(8 * var(--u)) rgba(168, 255, 61, .5);
    }

    .detail-reason-text {
      flex: 1;
      line-height: 1.5;
    }

    /* ---------- 发起人卡片 ---------- */
    .detail-host-card {
      display: flex;
      align-items: center;
      gap: calc(14 * var(--u));
      padding: calc(16 * var(--u));
      border-radius: calc(18 * var(--u));
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .detail-host-avatar {
      flex-shrink: 0;
      width: calc(56 * var(--u));
      height: calc(56 * var(--u));
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface-soft);
    }

    .detail-host-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-host-info {
      flex: 1;
      min-width: 0;
    }

    .detail-host-name {
      margin: 0 0 calc(4 * var(--u));
      font-size: calc(16 * var(--u));
      font-weight: 600;
    }

    .detail-host-bio {
      margin: 0;
      font-size: calc(13 * var(--u));
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-host-follow {
      flex-shrink: 0;
      height: calc(32 * var(--u));
      padding: 0 calc(14 * var(--u));
      border: 1px solid var(--brand);
      border-radius: calc(16 * var(--u));
      background: transparent;
      color: var(--brand);
      font-size: calc(13 * var(--u));
      font-weight: 600;
    }

    .detail-host-follow.active {
      background: var(--brand);
      color: #05080d;
    }

    /* ---------- 底部操作栏 ---------- */
    .detail-actions {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: calc(10 * var(--u));
      width: min(100vw, calc(430 * var(--u)));
      padding: calc(12 * var(--u)) calc(18 * var(--u)) calc(18 * var(--u) + env(safe-area-inset-bottom));
      background: rgba(5, 8, 13, .94);
      backdrop-filter: blur(calc(12 * var(--u)));
      border-top: 1px solid var(--border);
      transform: translateX(-50%);
    }

    .detail-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(6 * var(--u));
      height: calc(44 * var(--u));
      border: 1px solid var(--border);
      border-radius: calc(22 * var(--u));
      background: var(--surface);
      color: var(--text-main);
      font-size: calc(13 * var(--u));
      font-weight: 600;
      transition: all .18s ease;
    }

    .detail-action svg {
      width: calc(16 * var(--u));
      height: calc(16 * var(--u));
      fill: currentColor;
    }

    .detail-action.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #05080d;
    }

    .detail-action.active {
      border-color: var(--brand);
      color: var(--brand);
    }

    .detail-action:active {
      transform: scale(.97);
    }

    /* ---------- 空状态 ---------- */
    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: calc(32 * var(--u));
      color: var(--text-sub);
      text-align: center;
    }

    .detail-empty-title {
      margin: 0 0 calc(8 * var(--u));
      font-size: calc(18 * var(--u));
      font-weight: 700;
      color: var(--text-main);
    }
  </style>

  <header class="detail-header">
    <button class="detail-back" type="button" aria-label="返回首页" id="detailBackBtn">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12Z"/></svg>
    </button>
    <img class="detail-logo" src="assets/icons/app-logo.png" alt="Echoland 回声地">
    <button class="detail-share" type="button" aria-label="分享" id="detailShareBtn">
      <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92Z"/></svg>
    </button>
  </header>

  <div class="detail-body" id="detailBody">
    <!-- 动态渲染内容 -->
  </div>

  <div class="detail-actions">
    <button class="detail-action" type="button" id="detailFavBtn">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
      <span>收藏</span>
    </button>
    <button class="detail-action primary" type="button" id="detailJoinBtn">
      <svg viewBox="0 0 24 24"><path d="M19 15v3H5v-3H3v3c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-3h-2ZM13 12.67l2.59-2.58L17 10.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67Z"/></svg>
      <span>加入路线</span>
    </button>
    <button class="detail-action" type="button" id="detailInviteBtn">
      <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm-9-2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2Zm0 2c-2.21 0-4 1.79-4 4v2h8v-2c0-2.21-1.79-4-4-4Zm9 6h6v-2h-6v2Z"/></svg>
      <span>发起邀约</span>
    </button>
  </div>
</section>

<script>
  (function () {
    'use strict';

    const detailBody = document.getElementById('detailBody');
    const detailPanel = document.getElementById('tab-event-detail');
    const bottomTabs = document.querySelector('.bottom-tabs');

    function toggleBottomTabs(show) {
      if (bottomTabs) {
        bottomTabs.style.display = show ? '' : 'none';
      }
    }

    function findEvent(id) {
      const events = (typeof window !== 'undefined' && window.MOCK_EVENTS) ? window.MOCK_EVENTS : [];
      return events.find(evt => evt.id === id);
    }

    function formatDetailTime(startTime, endTime) {
      const s = new Date(startTime.replace(' ', 'T'));
      const e = new Date(endTime.replace(' ', 'T'));
      const pad = n => String(n).padStart(2, '0');
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return `${s.getFullYear()}.${pad(s.getMonth()+1)}.${pad(s.getDate())} ${weekdays[s.getDay()]} ${pad(s.getHours())}:${pad(s.getMinutes())} - ${pad(e.getHours())}:${pad(e.getMinutes())}`;
    }

    function renderDetail() {
      const id = (typeof window !== 'undefined' && window.CURRENT_EVENT_ID) ? window.CURRENT_EVENT_ID : '';
      const evt = findEvent(id);

      if (!evt || !detailBody) {
        if (detailBody) {
          detailBody.innerHTML = `
            <div class="detail-empty">
              <p class="detail-empty-title">活动不存在</p>
              <p>返回首页重新选择活动</p>
            </div>
          `;
        }
        return;
      }

      const priceText = evt.price === '免费' ? '免费' : '¥' + evt.price;
      const reasons = (evt.recommendReasons && evt.recommendReasons.length) ? evt.recommendReasons : ['小众精选', '城市探索', '不容错过'];
      const reasonsHtml = reasons.slice(0, 4).map(r => `
        <div class="detail-reason">
          <span class="detail-reason-dot"></span>
          <span class="detail-reason-text">${r}</span>
        </div>
      `).join('');
      const tagsHtml = (evt.tags || []).map(t => `<span class="detail-tag">${t}</span>`).join('');
      const host = evt.organizer || { name: '未知发起人', bio: '', logo: '' };

      detailBody.innerHTML = `
        <div class="detail-cover">
          <img src="${evt.cover}" alt="${evt.title}">
          <span class="detail-category">${evt.category}</span>
        </div>

        <h1 class="detail-title">${evt.title}</h1>

        <div class="detail-info-card">
          <div class="detail-info-row">
            <span class="detail-info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 16H5V9h14v11Z"/></svg>
            </span>
            <div class="detail-info-content">
              <span class="detail-info-label">活动时间</span>
              <span class="detail-info-value">${formatDetailTime(evt.startTime, evt.endTime)}</span>
            </div>
          </div>
          <div class="detail-info-row">
            <span class="detail-info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z"/></svg>
            </span>
            <div class="detail-info-content">
              <span class="detail-info-label">活动地点</span>
              <span class="detail-info-value">${evt.city}${evt.district} · ${evt.address}</span>
            </div>
          </div>
          <div class="detail-info-row">
            <span class="detail-info-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm1.41 16.09V20h-2v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05 1.18 1.91 2.53 1.91 1.29 0 2.13-.62 2.13-1.91 0-1.11-.96-1.5-2.53-2.02-1.96-.66-3.27-1.52-3.27-3.6 0-1.64 1.31-2.93 2.98-3.22V4h2v1.92c1.5.32 2.71 1.35 2.86 3.06h-1.96c-.1-.97-1.01-1.53-2.1-1.53-1.17 0-1.98.62-1.98 1.49 0 .98.91 1.33 2.53 1.91 1.98.73 3.27 1.66 3.27 3.71 0 1.79-1.43 3.09-3.15 3.42Z"/></svg>
            </span>
            <div class="detail-info-content">
              <span class="detail-info-label">活动费用</span>
              <span class="detail-info-value price">${priceText}</span>
            </div>
          </div>
        </div>

        <div class="detail-section">
          <h2 class="detail-section-title">活动标签</h2>
          <div class="detail-tags">${tagsHtml}</div>
        </div>

        <div class="detail-section">
          <h2 class="detail-section-title">活动简介</h2>
          <p class="detail-desc">${evt.description || '暂无活动简介'}</p>
        </div>

        <div class="detail-section">
          <h2 class="detail-section-title">推荐理由</h2>
          <div class="detail-reasons">${reasonsHtml}</div>
        </div>

        <div class="detail-section">
          <h2 class="detail-section-title">发起人</h2>
          <div class="detail-host-card">
            <div class="detail-host-avatar">
              <img src="${host.logo || 'https://placehold.co/56x56/11161d/ffffff?text=?' }" alt="${host.name}">
            </div>
            <div class="detail-host-info">
              <p class="detail-host-name">${host.name}</p>
              <p class="detail-host-bio">${host.bio || '探索城市里的每一种可能'}</p>
            </div>
            <button class="detail-host-follow" type="button" id="hostFollowBtn">关注</button>
          </div>
        </div>
      `;

      // 关注按钮
      const followBtn = document.getElementById('hostFollowBtn');
      if (followBtn) {
        followBtn.addEventListener('click', () => {
          followBtn.classList.toggle('active');
          followBtn.textContent = followBtn.classList.contains('active') ? '已关注' : '关注';
        });
      }
    }

    // 暴露全局渲染函数，供首页调用
    window.renderEventDetail = renderDetail;

    // 返回首页
    const backBtn = document.getElementById('detailBackBtn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        if (typeof window.switchTab === 'function') {
          window.switchTab('tab-home');
        }
      });
    }

    // 分享按钮
    const shareBtn = document.getElementById('detailShareBtn');
    if (shareBtn) {
      shareBtn.addEventListener('click', () => alert('分享功能即将上线'));
    }

    // 底部操作按钮
    const favBtn = document.getElementById('detailFavBtn');
    const joinBtn = document.getElementById('detailJoinBtn');
    const inviteBtn = document.getElementById('detailInviteBtn');

    if (favBtn) {
      favBtn.addEventListener('click', () => favBtn.classList.toggle('active'));
    }
    if (joinBtn) {
      joinBtn.addEventListener('click', () => alert('已加入路线（mock）'));
    }
    if (inviteBtn) {
      inviteBtn.addEventListener('click', () => alert('发起邀约功能即将上线'));
    }

    // 当详情页被激活时自动渲染，并隐藏全局底部导航；返回首页时恢复导航
    if (detailPanel) {
      const observer = new MutationObserver(() => {
        const isActive = detailPanel.classList.contains('active');
        if (isActive) {
          renderDetail();
          toggleBottomTabs(false);
        } else {
          toggleBottomTabs(true);
        }
      });
      observer.observe(detailPanel, { attributes: true, attributeFilter: ['class'] });
    }
  })();
</script>

      </div>
      <div id="tab-route" class="tab-panel">


      </div>
      <div id="tab-community" class="tab-panel">


      </div>
      <div id="tab-mine" class="tab-panel">


      </div>
    </main>

    <nav class="bottom-tabs" aria-label="底部导航">
      <button class="tab-btn active" data-tab="tab-home" type="button" aria-label="首页">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/home.png" alt="">
          <img class="icon-active" src="assets/icons/home-active.png" alt="">
        </span>
      </button>
      <button class="tab-btn" data-tab="tab-route" type="button" aria-label="AI 路线">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/route.png" alt="">
          <img class="icon-active" src="assets/icons/route-active.png" alt="">
        </span>
      </button>
      <button class="tab-btn" data-tab="tab-community" type="button" aria-label="社区">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/community.png" alt="">
          <img class="icon-active" src="assets/icons/community-active.png" alt="">
        </span>
      </button>
      <button class="tab-btn" data-tab="tab-mine" type="button" aria-label="我的">
        <span class="tab-icon">
          <img class="icon-default" src="assets/icons/mine.png" alt="">
          <img class="icon-active" src="assets/icons/mine-active.png" alt="">
        </span>
      </button>
    </nav>
  </div>

  <script>
    window.switchTab = function switchTab(tabId) {
      document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === tabId);
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
      });
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => window.switchTab(btn.dataset.tab));
    });
  </script>
</body>
</html>
