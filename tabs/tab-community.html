          content: '大家是怎么从这里离开的，我已经困了三天了。', likes: 17000, comments: 58, reposts: 53
        }
      ];

      const state = {
        savedPosts: readSavedPosts(),
        filter: 'recommended',
        query: '',
        compose: { content: '', images: [], location: null, activity: null, isMapPoint: false },
        selectedPostId: null,
        toastTimer: null
      };

      const feedEl = document.getElementById('community-feed');
      const emptyEl = document.getElementById('community-empty');
      const composePage = document.getElementById('community-compose-page');
      const composeText = document.getElementById('compose-text');
      const composePublish = document.getElementById('compose-publish');

      const composeCount = document.getElementById('compose-count');
      const composeImages = document.getElementById('compose-images');
      const composeSelections = document.getElementById('compose-selections');
      const sheetBackdrop = document.getElementById('community-sheet-backdrop');
      const sheet = document.getElementById('community-sheet');
      const toastEl = document.getElementById('community-toast');

      document.getElementById('community-menu').innerHTML = iconPaths.menu;
      document.getElementById('community-search').innerHTML = iconPaths.search;
      document.getElementById('compose-add-image').innerHTML = iconPaths.image;
      document.getElementById('compose-add-location').innerHTML = iconPaths.location;
      document.getElementById('compose-add-activity').innerHTML = iconPaths.ticket;

      function readSavedPosts() {
        try {
          const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(value) ? value.map(post => {
            const latestActivity = post.activity ? demoActivities.find(activity => activity.id === post.activity.id) : null;
            const latestLocation = post.location ? demoLocations.find(location => location.id === post.location.id) : null;
            return {
              ...post,
              ...(post.userId === 'user_current' ? { username: currentUsername, avatar: currentAvatar } : {}),
              ...(latestActivity ? { activity: latestActivity } : {}),
              ...(latestLocation ? { location: latestLocation } : {})
            };
          }) : [];
        } catch (error) {
          return [];
        }
      }

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
      }

      function activityTitleHTML(activity) {
        if (activity.id === 'evt_chen_jieli_2026') return '陈洁丽<br>《你happy我也happy》<br>2026动漫歌演唱会';
        if (activity.id === 'evt_shan_he_gu_ren_10') return '贾樟柯《山河故人》<br>十周年重映';
        return escapeHTML(activity.title).replace(' · ', '<br>');
      }

      function activityMetaHTML(activity) {
        return [activity.time, activity.venue].filter(Boolean).map(item => `<span class="attachment-sub-line">${escapeHTML(item)}</span>`).join('<span class="attachment-sub-divider"></span>');
      }

      function formatCount(value) {
        const count = Number(value || 0);
        if (count >= 10000) return `${(count / 10000).toFixed(count >= 100000 ? 0 : 1).replace('.0', '')}万`;
        return count ? count.toLocaleString('zh-CN') : '';
      }

      function formatTime(createdAt) {
        if (!createdAt) return '刚刚';
        const delta = Date.now() - new Date(createdAt).getTime();
        if (delta < 60000) return '刚刚';
        if (delta < 3600000) return `${Math.floor(delta / 60000)} 分钟`;
        if (delta < 86400000) return `${Math.floor(delta / 3600000)} 小时`;
        return `${Math.floor(delta / 86400000)} 天`;
      }

      function avatarHTML(post) {
        if (post.avatar) return `<span class="avatar"><img src="${escapeHTML(post.avatar)}" alt="${escapeHTML(post.username)}"></span>`;
        const hue = [...post.username].reduce((sum, char) => sum + char.charCodeAt(0), 0) % 360;
        return `<span class="avatar" style="background:linear-gradient(145deg,hsl(${hue} 35% 42%),hsl(${hue + 28} 30% 18%))">${escapeHTML(post.initials || post.username.slice(0, 1).toUpperCase())}</span>`;
      }

      function mediaHTML(post) {
        const images = Array.isArray(post.images) ? post.images : [];
        const media = images.length ? images : (post.media || []);
        if (!media.length) return '';
        const count = Math.min(media.length, 4);
        return `<div class="post-media-grid count-${count}">${media.slice(0, 4).map((item, index) => {
          if (images.length) {
            return `<button class="post-media${post.imageFit === 'contain' ? ' contain-image' : ''}" type="button" data-preview-src="${escapeHTML(item)}" aria-label="查看第 ${index + 1} 张图片"><img src="${escapeHTML(item)}" alt="动态图片 ${index + 1}"></button>`;
          }
          const mockContent = item === 'quote'
            ? '<div class="mock-media mock-quote"><strong>大家都在搜：说话声音有服务感</strong><span>“行吧，最近这两年经济不好，刷到啥就学啥吧。”</span></div>'
            : `<div class="mock-media mock-${escapeHTML(item)}">${item.includes('night') ? '南京 · 夜行记录' : item === 'river' ? '九乡河的水声' : '南朝石刻群'}</div>`;
          return `<div class="post-media">${mockContent}</div>`;
        }).join('')}</div>`;
      }

      function attachmentHTML(post) {
        let html = '';
        if (post.location) {
          html += `<button class="attachment-card location-card" type="button" data-location-id="${escapeHTML(post.location.id)}">
            <span class="attachment-icon">⌖</span><span class="attachment-copy"><span class="attachment-title">${escapeHTML(post.location.name)}</span><span class="attachment-sub">${escapeHTML(post.location.address || '查看地图位置')}</span></span>
            ${post.isMapPoint ? '<span class="map-point-badge"><span class="echo-point-mark">e</span>echo点</span>' : ''}
          </button>`;
        }
        if (post.activity) {
          html += `<button class="attachment-card activity-card" type="button" data-activity-id="${escapeHTML(post.activity.id)}">
            <span class="attachment-icon">票</span><span class="attachment-copy"><span class="attachment-title">${activityTitleHTML(post.activity)}</span><span class="attachment-sub">${activityMetaHTML(post.activity)}</span></span>

        return html;
      }

      function replyHTML(reply) {
        if (!reply) return '';
        const normalized = typeof reply === 'string'
          ? { username: reply.includes('：') ? reply.split('：')[0] : currentUsername, content: reply.includes('：') ? reply.split('：').slice(1).join('：') : reply, avatar: currentAvatar, timeLabel: '刚刚', likes: 0, comments: 0, reposts: 0 }
          : reply;
        return `<section class="thread-reply" aria-label="${escapeHTML(normalized.username)} 的回复">
          <div class="thread-reply-avatar">${avatarHTML(normalized)}</div>
          <div class="thread-reply-main">
            <header class="post-meta"><span class="post-name">${escapeHTML(normalized.username)}</span><time class="post-time">${escapeHTML(normalized.timeLabel || formatTime(normalized.createdAt))}</time><button class="post-more" type="button" data-reply-menu aria-label="回复的更多操作">•••</button></header>
            <p class="thread-reply-content">${escapeHTML(normalized.content)}</p>
            <div class="post-actions">
              <button class="post-action" type="button" data-reply-action="like" aria-label="喜欢回复">${iconPaths.heart}<span>${formatCount(normalized.likes)}</span></button>
              <button class="post-action" type="button" data-reply-action="comment" aria-label="评论回复">${iconPaths.comment}<span>${formatCount(normalized.comments)}</span></button>
              <button class="post-action" type="button" data-reply-action="repost" aria-label="转发回复">${iconPaths.repost}<span>${formatCount(normalized.reposts)}</span></button>
              <button class="post-action" type="button" data-reply-action="share" aria-label="分享回复">${iconPaths.share}</button>
            </div>
          </div>
        </section>`;
      }

      function postHTML(post) {
        const own = post.userId === 'user_current';
        return `<article class="post-card" data-post-id="${escapeHTML(post.id)}">
          <div class="post-avatar-rail">${avatarHTML(post)}${post.reply ? '<span class="post-thread-line" aria-hidden="true"></span>' : ''}</div>
          <div class="post-main">
            <header class="post-meta"><span class="post-name">${escapeHTML(post.username)}</span><time class="post-time">${escapeHTML(post.timeLabel || formatTime(post.createdAt))}</time><button class="post-more" type="button" data-post-menu="${escapeHTML(post.id)}" data-own="${own}" aria-label="更多操作">•••</button></header>
            <p class="post-content">${escapeHTML(post.content)}</p><button class="post-expand" type="button">展开</button>
            ${post.tags?.length ? `<div class="post-tags">${post.tags.map(tag => `<span class="post-tag">${escapeHTML(tag)}</span>`).join('')}</div>` : ''}
            ${mediaHTML(post)}${attachmentHTML(post)}
            <div class="post-actions">
              <button class="post-action ${post.liked ? 'liked' : ''}" type="button" data-action="like" aria-label="喜欢">${iconPaths.heart}<span>${formatCount(post.likes)}</span></button>
              <button class="post-action" type="button" data-action="comment" aria-label="评论">${iconPaths.comment}<span>${formatCount(post.comments)}</span></button>
              <button class="post-action" type="button" data-action="repost" aria-label="转发">${iconPaths.repost}<span>${formatCount(post.reposts)}</span></button>
              <button class="post-action" type="button" data-action="share" aria-label="分享">${iconPaths.share}</button>
            </div>
            ${replyHTML(post.reply)}
          </div>
        </article>`;
      }

      function allPosts() {
        let posts = [...state.savedPosts, ...mockPosts];
        if (state.filter === 'latest') posts = [...posts].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        if (state.filter === 'following') posts = posts.filter(post => [currentUsername, '小野同学', '阿紫在拍照'].includes(post.username));
        if (state.query.trim()) {
          const needle = state.query.trim().toLowerCase();
          posts = posts.filter(post => `${post.username} ${post.content}`.toLowerCase().includes(needle));
        }
        return posts;
      }

      function renderFeed() {
        const posts = allPosts();
        feedEl.innerHTML = posts.map(postHTML).join('');
        emptyEl.style.display = posts.length ? 'none' : 'block';
        requestAnimationFrame(() => {
          feedEl.querySelectorAll('.post-content').forEach(content => {
            const expand = content.nextElementSibling;
            if (content.scrollHeight > content.clientHeight + 2) expand.style.display = 'block';
          });
        });
      }

      function findPost(id) {
        return state.savedPosts.find(post => post.id === id) || mockPosts.find(post => post.id === id);
      }

      function persistSavedPosts() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.savedPosts));
      }

      function showToast(message) {
        clearTimeout(state.toastTimer);
        toastEl.textContent = message;
        toastEl.classList.add('show');
        state.toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      function openSheet(title, content, variant = '') {
        sheet.className = `community-sheet${variant ? ` ${variant}-picker-sheet` : ''}`;
        sheet.innerHTML = `<div class="sheet-handle"></div><h3>${escapeHTML(title)}</h3>${content}`;
        sheetBackdrop.classList.add('open');
      }

      function closeSheet() {
        sheetBackdrop.classList.remove('open');
        sheet.className = 'community-sheet';
        state.selectedPostId = null;
      }

      function openCompose(focusImage = false) {
        composePage.classList.add('open');
        document.body.classList.add('community-compose-open');
        requestAnimationFrame(() => {
          composeText.focus();
          if (focusImage) document.getElementById('compose-file').click();
        });
        updateCompose();
      }

      function closeCompose(force = false) {
        const dirty = state.compose.content.trim() || state.compose.images.length || state.compose.location || state.compose.activity || state.compose.isMapPoint;
        if (!force && dirty && !window.confirm('是否放弃编辑？')) return;
        composePage.classList.remove('open');
        document.body.classList.remove('community-compose-open');
        resetCompose();
      }

      function resetCompose() {
        state.compose = { content: '', images: [], location: null, activity: null, isMapPoint: false };
        composeText.value = '';
        document.getElementById('compose-file').value = '';
        updateCompose();
      }

      function updateCompose() {
        state.compose.content = composeText.value;
        const hasText = state.compose.content.trim().length > 0;
        const missingLocation = state.compose.isMapPoint && !state.compose.location;
        composePublish.disabled = !hasText || missingLocation;
        composeHint.textContent = missingLocation ? '请先选择地点，让别人知道它在哪里' : '';
        composeHint.classList.toggle('error', missingLocation);
        composeCount.textContent = `${state.compose.content.length} / 300`;
        document.getElementById('compose-map-switch').classList.toggle('on', state.compose.isMapPoint);
        document.getElementById('compose-map-switch').setAttribute('aria-checked', String(state.compose.isMapPoint));
        document.getElementById('compose-add-location').classList.toggle('active', Boolean(state.compose.location));
        document.getElementById('compose-add-activity').classList.toggle('active', Boolean(state.compose.activity));
        renderComposeImages();
        renderComposeSelections();
      }

      function renderComposeImages() {
        composeImages.innerHTML = state.compose.images.map((src, index) => `<div class="compose-image"><img src="${escapeHTML(src)}" alt="待发布图片 ${index + 1}"><button type="button" data-remove-image="${index}" aria-label="移除图片">×</button></div>`).join('');
      }

      function renderComposeSelections() {
        const rows = [];
        if (state.compose.location) rows.push(`<div class="compose-selection">⌖ <span>${escapeHTML(state.compose.location.name)}</span><button type="button" data-remove-selection="location" aria-label="移除地点">×</button></div>`);
        if (state.compose.activity) rows.push(`<div class="compose-selection">票 <span>${escapeHTML(state.compose.activity.title)}</span><button type="button" data-remove-selection="activity" aria-label="移除活动">×</button></div>`);
        composeSelections.innerHTML = rows.join('');
      }

      function publishPost() {
        if (composePublish.disabled) return;
        composePublish.disabled = true;
        composePublish.textContent = '发布中';
        const publishedAsMapPoint = state.compose.isMapPoint;
        const newPost = {
          id: `post_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          userId: 'user_current', username: currentUsername, avatar: currentAvatar,
          content: state.compose.content.trim(), images: [...state.compose.images], createdAt: new Date().toISOString(),
          location: state.compose.location, activity: state.compose.activity, isMapPoint: state.compose.isMapPoint,
          likes: 0, comments: 0, reposts: 0, liked: false
        };
        setTimeout(() => {
          state.savedPosts = [newPost, ...state.savedPosts];
          persistSavedPosts();
          window.dispatchEvent(new CustomEvent('echoland:post-created', { detail: newPost }));
          composePublish.textContent = '发布';
          closeCompose(true);
          state.filter = 'recommended';
          document.querySelectorAll('.feed-filter button').forEach(button => button.classList.toggle('active', button.dataset.filter === 'recommended'));
          renderFeed();
          document.querySelector('.community-page').scrollIntoView({ behavior: 'smooth', block: 'start' });
          showToast(publishedAsMapPoint ? '已发布并设为echo点' : '发布成功');
        }, 420);
      }

      function locationPicker() {
        openSheet('选择地点', demoLocations.map(location => `<button class="sheet-option" type="button" data-pick-location="${location.id}"><span class="attachment-icon">⌖</span><span class="sheet-option-copy"><span class="sheet-option-title">${escapeHTML(location.name)}</span><span class="sheet-option-sub">${escapeHTML(location.address)}</span></span></button>`).join(''));
      }

      function activityPicker() {
        openSheet('选择活动', `<div class="activity-search-wrap">${iconPaths.search}<input class="activity-search-input" id="activity-search-input" type="search" placeholder="搜索活动名称或场地" autocomplete="off"></div><div class="activity-sug-label">推荐活动</div><div class="activity-sug-list" id="activity-sug-list"></div>`, 'activity');
        renderActivitySuggestions('');
        requestAnimationFrame(() => document.getElementById('activity-search-input')?.focus());
      }

      function renderActivitySuggestions(query) {
        const target = document.getElementById('activity-sug-list');
        if (!target) return;
        const keyword = query.trim().toLowerCase();
        const suggestions = demoActivities.filter(activity => `${activity.title} ${activity.time} ${activity.venue}`.toLowerCase().includes(keyword));
        target.innerHTML = suggestions.length
          ? suggestions.map(activity => `<button class="sheet-option activity-option" type="button" data-pick-activity="${activity.id}"><span class="attachment-icon">票</span><span class="sheet-option-copy"><span class="sheet-option-title">${activityTitleHTML(activity)}</span><span class="sheet-option-sub">${activityMetaHTML(activity)}</span></span></button>`).join('')
          : '<div class="activity-sug-empty">没有找到相关活动</div>';
      }

      function postMenu(post) {
        const own = post?.userId === 'user_current';
        openSheet('动态操作', `<button class="sheet-option" type="button" data-sheet-action="copy">复制内容</button><button class="sheet-option" type="button" data-sheet-action="hide">不感兴趣</button><button class="sheet-option" type="button" data-sheet-action="report">举报</button>${own ? '<button class="sheet-option danger" type="button" data-sheet-action="delete">删除动态</button>' : ''}`);
      }

      function commentSheet(post) {
        openSheet('写评论', `<div style="display:flex;gap:calc(9 * var(--u));padding-bottom:calc(6 * var(--u))"><input id="community-comment-input" maxlength="120" placeholder="回复 ${escapeHTML(post.username)}" style="flex:1;min-width:0;height:calc(44 * var(--u));padding:0 calc(13 * var(--u));border:1px solid rgba(255,255,255,.1);border-radius:calc(14 * var(--u));outline:0;background:#0d1014;color:#fff"><button type="button" data-sheet-action="submit-comment" style="padding:0 calc(15 * var(--u));border-radius:calc(14 * var(--u));background:var(--brand);color:#0b0d09;font-weight:700">发送</button></div>`);
        requestAnimationFrame(() => document.getElementById('community-comment-input')?.focus());
      }

      function repostSheet(post) {
        openSheet('转发', `<button class="sheet-option" type="button" data-sheet-action="repost-community">转发到社区</button><button class="sheet-option" type="button" data-sheet-action="copy-link">复制链接</button>`);
      }

      async function copyText(text, successMessage) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (error) {
          const helper = document.createElement('textarea');
          helper.value = text;
          helper.style.position = 'fixed';
          helper.style.opacity = '0';
          document.body.appendChild(helper);
          helper.select();
          document.execCommand('copy');
          helper.remove();
        }
        showToast(successMessage);
      }

      function goToLocation(locationId) {
        if (!window.MOCK_ECHO_POINTS?.some(point => point.id === locationId)) return;
        window.CURRENT_ECHO_ID = locationId;
        window.CURRENT_EVENT_ID = '';
        window.DETAIL_RETURN_TAB = 'tab-community';
        if (typeof window.switchTab === 'function') window.switchTab('tab-event-detail');
        if (typeof window.renderEventDetail === 'function') window.renderEventDetail();
      }

      function goToActivity(activityId) {
        if (!window.MOCK_EVENTS?.some(event => event.id === activityId)) return;
        window.CURRENT_EVENT_ID = activityId;
        window.CURRENT_ECHO_ID = '';
        window.DETAIL_RETURN_TAB = 'tab-community';
        if (typeof window.switchTab === 'function') window.switchTab('tab-event-detail');
        if (typeof window.renderEventDetail === 'function') window.renderEventDetail();
      }

      document.getElementById('community-logo').addEventListener('click', () => {
        state.savedPosts = readSavedPosts();
        renderFeed();
        document.querySelector('.community-page').scrollIntoView({ behavior: 'smooth', block: 'start' });
        showToast('已刷新');
      });

      document.getElementById('community-menu').addEventListener('click', () => openSheet('社区', '<button class="sheet-option" type="button" data-sheet-action="menu-home">回到推荐</button><button class="sheet-option" type="button" data-sheet-action="menu-saved">我发布的动态</button><button class="sheet-option" type="button" data-sheet-action="menu-about">关于回声地</button>'));
      document.getElementById('community-search').addEventListener('click', () => {
        document.getElementById('community-searchbar').classList.add('open');
        document.getElementById('community-search-input').focus();
      });
      document.getElementById('community-search-cancel').addEventListener('click', () => {
        state.query = '';
        document.getElementById('community-search-input').value = '';
        document.getElementById('community-searchbar').classList.remove('open');
        renderFeed();
      });
      document.getElementById('community-search-input').addEventListener('input', event => { state.query = event.target.value; renderFeed(); });

      document.querySelectorAll('[data-open-compose], #quick-compose').forEach(button => button.addEventListener('click', () => openCompose(false)));
      document.querySelectorAll('.feed-filter button').forEach(button => button.addEventListener('click', () => {
        state.filter = button.dataset.filter;
        document.querySelectorAll('.feed-filter button').forEach(item => item.classList.toggle('active', item === button));
        renderFeed();
      }));

      feedEl.addEventListener('click', event => {
        const card = event.target.closest('.post-card');
        if (!card) return;
        const post = findPost(card.dataset.postId);
        const actionButton = event.target.closest('[data-action]');
        const menuButton = event.target.closest('[data-post-menu]');
        const locationButton = event.target.closest('[data-location-id]');
        const activityButton = event.target.closest('[data-activity-id]');
        const previewButton = event.target.closest('[data-preview-src]');
        const expandButton = event.target.closest('.post-expand');
        if (actionButton?.dataset.action === 'like') {
          post.liked = !post.liked;
          post.likes = Math.max(0, Number(post.likes || 0) + (post.liked ? 1 : -1));
          if (post.userId === 'user_current') persistSavedPosts();
          renderFeed();
        } else if (actionButton?.dataset.action === 'comment') {
          state.selectedPostId = post.id;
          commentSheet(post);
        } else if (actionButton?.dataset.action === 'repost') {
          state.selectedPostId = post.id;
          repostSheet(post);
        } else if (actionButton?.dataset.action === 'share') {
          copyText(`${location.origin}${location.pathname}#community/post/${post.id}`, '已复制分享链接');
        } else if (menuButton) {
          state.selectedPostId = post.id;
          postMenu(post);
        } else if (locationButton) {
          goToLocation(locationButton.dataset.locationId);
        } else if (activityButton) {
          goToActivity(activityButton.dataset.activityId);
        } else if (previewButton) {
          document.getElementById('preview-image').src = previewButton.dataset.previewSrc;
          document.getElementById('community-preview').classList.add('open');
          document.body.classList.add('community-preview-open');
        } else if (expandButton) {
          const content = expandButton.previousElementSibling;
          const expanded = content.classList.toggle('expanded');
          expandButton.textContent = expanded ? '收起' : '展开';
        }
      });

      document.getElementById('compose-cancel').addEventListener('click', () => closeCompose(false));
      composeText.addEventListener('input', updateCompose);
      document.getElementById('compose-publish').addEventListener('click', publishPost);
      document.getElementById('compose-add-image').addEventListener('click', () => document.getElementById('compose-file').click());
      document.getElementById('compose-add-location').addEventListener('click', locationPicker);
      document.getElementById('compose-add-activity').addEventListener('click', activityPicker);
      document.getElementById('compose-map-switch').addEventListener('click', () => { state.compose.isMapPoint = !state.compose.isMapPoint; updateCompose(); });

      document.getElementById('compose-file').addEventListener('change', event => {
        const available = 4 - state.compose.images.length;
        const files = [...event.target.files].slice(0, available);
        if (!files.length) {
          if (available <= 0) showToast('最多添加 4 张图片');
          return;
        }
        Promise.all(files.map(file => new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        }))).then(images => {
          state.compose.images.push(...images);
          event.target.value = '';
          updateCompose();
        });
      });

      composeImages.addEventListener('click', event => {
        const button = event.target.closest('[data-remove-image]');
        if (!button) return;
        state.compose.images.splice(Number(button.dataset.removeImage), 1);
        updateCompose();
      });

      composeSelections.addEventListener('click', event => {
        const button = event.target.closest('[data-remove-selection]');
        if (!button) return;
        state.compose[button.dataset.removeSelection] = null;
        updateCompose();
      });

      sheetBackdrop.addEventListener('click', event => {
        if (event.target === sheetBackdrop) closeSheet();
        const locationButton = event.target.closest('[data-pick-location]');
        const activityButton = event.target.closest('[data-pick-activity]');
        const actionButton = event.target.closest('[data-sheet-action]');
        if (locationButton) {
          state.compose.location = demoLocations.find(item => item.id === locationButton.dataset.pickLocation);
          closeSheet(); updateCompose();
        } else if (activityButton) {
          state.compose.activity = demoActivities.find(item => item.id === activityButton.dataset.pickActivity);
          closeSheet(); updateCompose();
        } else if (actionButton) {
          const action = actionButton.dataset.sheetAction;
          const post = findPost(state.selectedPostId);
          if (action === 'copy' && post) copyText(post.content, '已复制内容');
          if (action === 'copy-link' && post) copyText(`${location.origin}${location.pathname}#community/post/${post.id}`, '已复制链接');
          if (action === 'hide' && post) {
            const mockIndex = mockPosts.indexOf(post);
            if (mockIndex >= 0) mockPosts.splice(mockIndex, 1);
            renderFeed(); showToast('已减少此类内容');
          }
          if (action === 'report') showToast('已收到，我们会核查');
          if (action === 'delete' && post) { state.savedPosts = state.savedPosts.filter(item => item.id !== post.id); persistSavedPosts(); renderFeed(); showToast('动态已删除'); }
          if (action === 'submit-comment' && post) {
            const input = document.getElementById('community-comment-input');
            if (!input?.value.trim()) { showToast('先写一句评论'); return; }
            post.comments = Number(post.comments || 0) + 1;
            post.reply = `${currentUsername}：${input.value.trim()}`;
            if (post.userId === 'user_current') persistSavedPosts();
            renderFeed(); showToast('评论已发布');
          }
          if (action === 'repost-community') showToast('转发功能已预留');
          if (action === 'menu-home') { state.filter = 'recommended'; renderFeed(); }
          if (action === 'menu-saved') { state.query = currentUsername; renderFeed(); }
          if (action === 'menu-about') showToast('Echoland · 发现城市里的回声');
          closeSheet();
        }
      });

      sheetBackdrop.addEventListener('input', event => {
        if (event.target.id === 'activity-search-input') renderActivitySuggestions(event.target.value);
      });

      document.getElementById('preview-close').addEventListener('click', () => {
        document.getElementById('community-preview').classList.remove('open');
        document.body.classList.remove('community-preview-open');
      });

      window.addEventListener('storage', event => {
        if (event.key === STORAGE_KEY) { state.savedPosts = readSavedPosts(); renderFeed(); }
      });

      renderFeed();
      updateCompose();
    })();
  </script>
</section>
