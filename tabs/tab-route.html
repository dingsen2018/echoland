  // ====== INIT ======
  function routeInit() {
    routeRenderParamControls();
    routeSyncChips();
    renderCommunityRoutes();
    routeUpdateSavedToggle();
  }

  // ====== TIME ======
  window.routeSetTime = function(val) {
    routeIsTonight = (val === '今晚');
    document.querySelectorAll('#routeTimeOptions .time-opt').forEach(o => {
      o.classList.toggle('sel', o.dataset.val === val);
    });
    routeUpdateMode();
  };

  // ====== CHIPS ======
  function routeRenderParamControls() {
    const container = document.getElementById('routeChips');
    if (!container) return;
    container.innerHTML = Object.keys(CHIP_OPTIONS).map(key => `
      <button class="route-param-control" type="button" data-route-param-trigger="${key}" aria-label="选择${CHIP_LABELS[key]}">
        <span class="route-param-label">${CHIP_LABELS[key]}</span>
        <span class="route-param-value">${routeChipValues[key]}</span>
      </button>
    `).join('');
    container.querySelectorAll('[data-route-param-trigger]').forEach(button => button.addEventListener('click', () => routeOpenFilter(button.dataset.routeParamTrigger)));
  }

  window.routeChipCycle = function(key) {
    if (!CHIP_OPTIONS[key]) return;
    routeSyncChips();
  };

  function routeSyncChips() {
    document.querySelectorAll('#routeChips [data-route-param-trigger]').forEach(control => {
      let key = control.dataset.routeParamTrigger;
      if (!key) return;
      let val = routeChipValues[key];
      control.querySelector('.route-param-value').textContent = val;
      control.classList.toggle('set', val !== CHIP_OPTIONS[key][0]);
    });
  }

  function routeOpenFilter(key) {
    const sheet = document.getElementById('routeFilterSheet');
    const title = document.getElementById('routeFilterTitle');
    const options = document.getElementById('routeFilterOptions');
    if (!sheet || !CHIP_OPTIONS[key]) return;
    sheet.dataset.key = key;
    title.textContent = `选择${CHIP_LABELS[key]}`;
    options.innerHTML = CHIP_OPTIONS[key].map(value => `<button class="route-filter-option${value === routeChipValues[key] ? ' selected' : ''}" type="button" data-route-filter-value="${value}">${value}</button>`).join('');
    sheet.classList.add('show');
    sheet.setAttribute('aria-hidden', 'false');
  }

  function routeCloseFilter() {
    const sheet = document.getElementById('routeFilterSheet');
    if (!sheet) return;
    sheet.classList.remove('show');
    sheet.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('routeFilterSheet')?.addEventListener('click', event => {
    const sheet = event.currentTarget;
    const option = event.target.closest('[data-route-filter-value]');
    if (event.target === sheet) routeCloseFilter();
    if (option) {
      routeChipValues[sheet.dataset.key] = option.dataset.routeFilterValue;
      routeSyncChips();
      routeCloseFilter();
    }
  });

  function routeUpdateMode() {
    let tip = document.getElementById('routeModeTip');
    let btn = document.getElementById('routeGenerateBtn');
    let input = document.getElementById('routeNlInput');
    if (routeIsTonight) {
      tip.textContent = '帮你安排';
      btn.textContent = '立刻生成';
      btn.className = 'route-generate-btn';
      input.placeholder = '明晚想听点独立音乐，预算100以内...';
    } else {
      tip.textContent = 'AI 帮你规划行程';
      btn.textContent = '生成路线';
      btn.className = 'route-generate-btn plan-mode';
      input.placeholder = '周六下午想带朋友逛市集...';
    }
  }

  // ====== SAVED ======
  window.routeToggleSaved = function() {
    routeSavedOn = !routeSavedOn;
    routeUpdateSavedToggle();
  };

  function routeUpdateSavedToggle() {
    let sw = document.getElementById('routeSavedSwitch');
    if (!sw) return;
    sw.className = 'toggle-switch' + (routeSavedOn ? ' on' : '');
  }

  // ====== NL INPUT ======
  window.routeOnNlInput = function() {
    let val = document.getElementById('routeNlInput').value;
    if (val.includes('今晚')) { routeIsTonight = true; routeSetTime('今晚'); }
    else if (val.includes('明天') || val.includes('周六') || val.includes('周日')) { routeIsTonight = false; routeSetTime('明天'); }
    if (val.includes('100') || val.includes('穷游')) routeChipValues.budget = '≤¥100';
    if (val.includes('50') && !val.includes('150')) routeChipValues.budget = '≤¥50';
    if (val.includes('3小时') || val.includes('三小时')) routeChipValues.duration = '3h';
    if (val.includes('4小时') || val.includes('四小时')) routeChipValues.duration = '4h+';
    if (val.includes('独立音乐') || val.includes('音乐')) routeChipValues.activityType = '音乐';
    if (val.includes('展览')) routeChipValues.activityType = '展览';
    if (val.includes('安静')) routeChipValues.quiet = '高';
    if (val.includes('不想太嗨')) routeChipValues.nightlife = '低';
    if (val.includes('骑车')) routeChipValues.transport = '骑车';
    if (val.includes('开车')) routeChipValues.transport = '开车';
    if (val.includes('一个人') || val.includes('独自')) routeChipValues.companion = '独自';
    if (val.includes('朋友') || val.includes('带')) routeChipValues.companion = '小组(3-6)';
    if (val.includes('不想走')) routeChipValues.energy = '轻松';
    if (val.includes('认识新朋友')) routeChipValues.social = '认识新朋友';
    routeSyncChips();
    routeUpdateMode();
  };

  // ====== GENERATE ======
  window.routeGenerate = function() {
    // Clear any existing timers
    routeGenTimers.forEach(t => clearInterval(t));
    routeGenTimers = [];

    let homeView = document.getElementById('routeHomeView');
    let genView = document.getElementById('routeGenView');
    let bottomBar = document.getElementById('routeBottomBar');
    let alert = document.getElementById('routeAlert');

    alert.classList.remove('show');
    homeView.style.display = 'none';
    genView.classList.add('show');
    bottomBar.classList.remove('show');

    let genText = document.getElementById('routeGenText');
    let genStops = document.getElementById('routeGenStops');
    let stopCount = ROUTE_GEN_DATA.stops.length;

    genText.textContent = '';
    genStops.innerHTML = '';
    for (let i = 0; i < stopCount; i++) {
      let ph = document.createElement('div');
      ph.className = 'route-gen-placeholder';
      ph.textContent = '... 站点生成中';
      genStops.appendChild(ph);
    }

    let msg = routeIsTonight
      ? '正在为你匹配今晚的路线...'
      : '正在为你规划周末的文艺路线...';
    let idx = 0;
    let t1 = setInterval(() => {
      if (idx < msg.length) {
        genText.textContent += msg[idx];
        idx++;
      } else {
        clearInterval(t1);
        let sIdx = 0;
        let t2 = setInterval(() => {
          if (sIdx < stopCount) {
            genStops.children[sIdx].classList.add('active');
            setTimeout(() => {
              let stop = ROUTE_GEN_DATA.stops[sIdx];
              let el = genStops.children[sIdx];
              el.classList.remove('active','route-gen-placeholder');
              el.outerHTML = renderStopCard(stop, sIdx, 'preview');
            }, 600);
            sIdx++;
          } else {
            clearInterval(t2);
            setTimeout(() => routeFinishGeneration(), 500);
          }
        }, 800);
        routeGenTimers.push(t2);
      }
    }, 40);
    routeGenTimers.push(t1);
  };

  function renderStopCard(stop, index, mode) {
    let isActivity = stop.type === 'activity';
    let numMap = {0:1, 1:'A', 2:2, 3:'B'};
    let num = numMap[index] || index;
    let numClass = 'route-stop-num' + (isActivity ? '' : ' place-num');
    let checked = mode === 'preview' ? false : (routeSelectedStops[stop.id] !== false);
    let cardClass = 'route-stop-card ' + (isActivity ? 'activity' : 'place');
    if (mode === 'selection') cardClass += checked ? ' selected' : ' deselected';

    let coverImages = {
      's1': 'assets/route/stop-1.jpg',
      's2': 'assets/route/stop-2.jpg',
      's3': 'assets/route/stop-3.jpg',
      's4': 'assets/route/stop-4.jpg'
    };

    let html = '<div class="' + cardClass + '" data-id="' + stop.id + '">';
    let coverImg = coverImages[stop.id] || '';
    html += '<div class="route-stop-cover"' + (coverImg ? ' style="background:url(' + coverImg + ') center/cover no-repeat"' : '') + '>';
    if (isActivity) {
      html += '<div class="stop-badge ' + (stop.price === 0 ? 'free' : 'paid') + '">' + (stop.price === 0 ? '免费' : stop.priceLabel) + '</div>';
    }
    html += '</div>';
    html += '<div class="route-stop-body">';
    html += '<div class="' + numClass + '">' + num + '</div>';
    html += '<div class="route-stop-info">';
    html += '<div class="stop-title">' + stop.title + '</div>';
    html += '<div class="stop-location">' + stop.location;
    if (stop.tag) html += '<span class="stop-tag ai-rec">' + stop.tag + '</span>';
    html += '</div>';
    if (stop.timeBadge && isActivity) html += '<div class="stop-time-badge">' + stop.timeBadge + '</div>';
    html += '</div>';
    if (mode === 'selection') {
      html += '<div class="route-stop-check' + (checked ? ' checked' : '') + '" onclick="event.stopPropagation();routeToggleStop(\'' + stop.id + '\')">&#10003;</div>';
    } else {
      html += '<div class="route-stop-check checked">&#10003;</div>';
    }
    html += '</div></div>';
    return html;
  }

  function routeFinishGeneration() {
    let genView = document.getElementById('routeGenView');
    let bottomBar = document.getElementById('routeBottomBar');

    routeGenStops = JSON.parse(JSON.stringify(ROUTE_GEN_DATA.stops));
    routeSelectedStops = {};
    routeGenStops.forEach(s => routeSelectedStops[s.id] = true);

    let genStops = document.getElementById('routeGenStops');
    genStops.innerHTML = routeGenStops.map((s, i) => renderStopCard(s, i, 'selection')).join('');

    let reasonDiv = document.createElement('div');
    reasonDiv.className = 'route-reason';
    reasonDiv.innerHTML = '<div class="route-reason-title">&#9733; 推荐理由</div>' + ROUTE_GEN_DATA.reason;
    genStops.appendChild(reasonDiv);

    bottomBar.classList.add('show');
    routeUpdateBottomBar();
  }

  window.routeToggleStop = function(id) {
    routeSelectedStops[id] = !routeSelectedStops[id];
    let card = document.querySelector('[data-id="' + id + '"]');
    let check = card.querySelector('.route-stop-check');
    if (routeSelectedStops[id]) {
      card.classList.remove('deselected');
      card.classList.add('selected');
      check.classList.add('checked');
    } else {
      card.classList.remove('selected');
      card.classList.add('deselected');
      check.classList.remove('checked');
    }
    routeUpdateBottomBar();
  };

  function routeUpdateBottomBar() {
    let selected = Object.entries(routeSelectedStops).filter(([k,v]) => v).length;
    let cost = routeGenStops.filter(s => routeSelectedStops[s.id]).reduce((sum, s) => sum + s.price, 0);
    let countEl = document.getElementById('barSelectedCount');
    let costEl = document.getElementById('barCost');
    let actionBtn = document.getElementById('barActionBtn');

    countEl.textContent = selected;
    costEl.textContent = '¥' + cost;

    if (selected < 2) {
      countEl.classList.add('low');
      actionBtn.disabled = true;
      actionBtn.textContent = '至少选择2个站点';
      let alert = document.getElementById('routeAlert');
      alert.className = 'route-alert info show';
      alert.textContent = '至少选择2个站点才能生成路线';
    } else {
      countEl.classList.remove('low');
      actionBtn.disabled = false;
      actionBtn.textContent = '生成我的路线';
      document.getElementById('routeAlert').classList.remove('show');
    }
  }

  // ====== SAVE TO EDIT ======
  window.routeSaveToEdit = function() {
    let selected = Object.entries(routeSelectedStops).filter(([k,v]) => v).length;
    if (selected < 2) return;
    routeEditStops = routeGenStops.filter(s => routeSelectedStops[s.id]).map(s => JSON.parse(JSON.stringify(s)));
    document.getElementById('routeEditTitle').textContent = ROUTE_GEN_DATA.title;
    document.getElementById('routeGenView').classList.remove('show');
    document.getElementById('routeHomeView').style.display = 'none';
    document.getElementById('routeBottomBar').classList.remove('show');
    document.getElementById('routeEditPage').classList.add('show');
    routeRenderEditStops();
    routeUpdateEditSummary();
  };

  function routeRenderEditStops() {
    let container = document.getElementById('routeEditStops');
    container.innerHTML = routeEditStops.map((s, i) => {
      let isActivity = s.type === 'activity';
      let num = isActivity ? (i + 1) : String.fromCharCode(65 + (i - 1));
      let numClass = 'route-stop-num' + (isActivity ? '' : ' place-num');
      return '<div class="route-edit-stop" data-idx="' + i + '">' +
        '<div class="swipe-actions">' +
          '<div class="swipe-btn replace-btn" onclick="event.stopPropagation();routeOpenReplace(' + i + ')">替换</div>' +
          '<div class="swipe-btn delete-btn" onclick="event.stopPropagation();routeDeleteStop(' + i + ')">删除</div>' +
        '</div>' +
        '<div class="edit-stop-inner" onclick="routeToggleEditExpand(event,' + i + ')">' +
          '<div class="drag-handle">::</div>' +
          '<div class="' + numClass + '">' + num + '</div>' +
          '<div class="route-stop-info">' +
            '<div class="stop-title">' + s.title + '</div>' +
            '<div class="stop-location">' + s.location + (s.price ? ' · ' + s.priceLabel : '') +
              (s.tag ? '<span class="stop-tag ai-rec">' + s.tag + '</span>' : '') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="stop-detail">' + s.desc + '</div>' +
      '</div>';
    }).join('');

    container.querySelectorAll('.route-edit-stop').forEach(card => {
      let startX = 0, startY = 0;
      card.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      card.addEventListener('touchmove', e => {
        let dx = e.touches[0].clientX - startX;
        let dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) && dx < 0) {
          card.classList.add('swiped');
        } else if (dx > 12 && Math.abs(dx) > Math.abs(dy)) {
          card.classList.remove('swiped');
        }
      }, { passive: true });
      card.addEventListener('mouseleave', () => card.classList.remove('swiped'));
    });
  }

  window.routeToggleEditExpand = function(e, idx) {
    let card = document.querySelector('.route-edit-stop[data-idx="' + idx + '"]');
    if (card.classList.contains('swiped')) {
      card.classList.remove('swiped');
      return;
    }
    document.querySelectorAll('.route-edit-stop.expanded').forEach(c => {
      if (c.dataset.idx !== String(idx)) c.classList.remove('expanded');
    });
    card.classList.toggle('expanded');
  };

  window.routeDeleteStop = function(idx) {
    if (routeEditStops.length <= 2) {
      alert('路线至少需要保留2个站点');
      return;
    }
    routeEditStops.splice(idx, 1);
    routeRenderEditStops();
    routeUpdateEditSummary();
  };

  window.routeOpenReplace = function(idx) {
    let sheet = document.getElementById('routeReplaceSheet');
    let cards = document.getElementById('routeReplaceCards');
    cards.innerHTML = REPLACE_CANDIDATES.map(c =>
      '<div class="route-replace-card" onclick="routeDoReplace(' + idx + ',' + c.price + ',\'' + c.title + '\')">' +
        '<div class="rep-title">' + c.title + '</div>' +
        '<div class="rep-meta">' + c.time + ' · ' + c.location + '</div>' +
        '<div class="rep-price' + (c.price === 0 ? ' free' : '') + '">' + (c.price === 0 ? '免费' : '¥' + c.price) + '</div>' +
      '</div>'
    ).join('') +
    '<div class="route-replace-card add-custom" onclick="routeCloseReplace()"><div class="add-icon">+</div>自己添加</div>';
    sheet.classList.add('show');
  };

  window.routeDoReplace = function(idx, price, title) {
    routeEditStops[idx].price = price;
    routeEditStops[idx].priceLabel = price === 0 ? '免费' : '¥' + price;
    routeEditStops[idx].title = title;
    routeRenderEditStops();
    routeUpdateEditSummary();
    routeCloseReplace();
  };

  window.routeCloseReplace = function() {
    document.getElementById('routeReplaceSheet').classList.remove('show');
  };

  function routeUpdateEditSummary() {
    let cost = routeEditStops.reduce((s, c) => s + c.price, 0);
    let dur = routeEditStops.length * 0.6 + 0.5;
    document.getElementById('editDuration').textContent = dur.toFixed(1) + 'h';
    document.getElementById('editCost').textContent = '¥' + cost;
  }

  window.routeCloseEdit = function() {
    // 保存当前编辑结果，打开导航页
    routeOpenNav();
  };

  // ====== NAVIGATION ======
  let routeNavFaved = false;
  let routeNavStops = [];
  let routeNavTargetIdx = 0;
  let routeUserLoc = null; // { lat, lng }

  window.routeOpenNav = function() {
    routeNavStops = routeEditStops.map(s => JSON.parse(JSON.stringify(s)));
    let dur = routeNavStops.length * 0.6 + 0.5;
    let cost = routeNavStops.reduce((s, c) => s + c.price, 0);

    document.getElementById('routeEditPage').classList.remove('show');
    document.getElementById('navTitle').textContent = document.getElementById('routeEditTitle').textContent;
    document.getElementById('navDuration').textContent = dur.toFixed(1) + 'h';
    document.getElementById('navCost').textContent = '¥' + cost;
    document.getElementById('navStops').textContent = routeNavStops.length;

    // Render timeline
    let timeline = document.getElementById('navTimeline');
    let now = 19;
    timeline.innerHTML = routeNavStops.map((s, i) => {
      let timeStr = (s.type === 'activity') ? (now + ':00') : '途经';
      if (s.type === 'activity' && i > 0) now = now + 1;
      return '<div class="route-nav-item">' +
        '<div class="route-nav-dot"></div>' +
        '<div class="route-nav-card">' +
          '<div class="route-nav-time">' + timeStr + '</div>' +
          '<div class="route-nav-spot">' + s.title + '</div>' +
          '<div class="route-nav-desc">' + s.desc + '</div>' +
          '<div class="route-nav-location">' +
            '<span>' + s.location + '</span>' +
            '<button class="route-nav-btn" onclick="event.stopPropagation();routeNavToHere(' + i + ')">&rarr; 到这里</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    routeNavFaved = false;
    routeNavTargetIdx = 0;
    document.getElementById('navFavBtn').textContent = '\u2661';
    document.getElementById('navFavBtn').classList.remove('faved');
    document.getElementById('navStartBtn').textContent = '开始导航';
    document.getElementById('routeNavPage').classList.add('show');

    // Try to get user location
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) { routeUserLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
        function() { routeUserLoc = null; },
        { timeout: 5000, maximumAge: 60000 }
      );
    }
  };

  window.routeCloseNav = function() {
    document.getElementById('routeNavPage').classList.remove('show');
    document.getElementById('routeHomeView').style.display = 'block';
    document.getElementById('routeGenView').classList.remove('show');
    document.getElementById('routeBottomBar').classList.remove('show');
  };

  window.routeToggleNavFav = function() {
    routeNavFaved = !routeNavFaved;
    let btn = document.getElementById('navFavBtn');
    if (routeNavFaved) {
      btn.textContent = '\u2665';
      btn.classList.add('faved');
    } else {
      btn.textContent = '\u2661';
      btn.classList.remove('faved');
    }
  };

  window.routeShareRoute = function() {
    let title = document.getElementById('navTitle').textContent;
    let dur = document.getElementById('navDuration').textContent;
    let cost = document.getElementById('navCost').textContent;
    let stops = document.getElementById('navStops').textContent;
    let shareText = title + ' - ' + stops + '站 · ' + dur + ' · ' + cost;
    navigator.clipboard && navigator.clipboard.writeText(shareText);
    document.getElementById('navShareAlert').querySelector('.nav-alert-text').textContent = '路线已复制到剪贴板：\n"' + shareText + '"';
    document.getElementById('navShareAlert').classList.add('show');
  };

  window.routeCloseShareAlert = function() {
    document.getElementById('navShareAlert').classList.remove('show');
  };

  // ====== 导航面板 ======
  window.routeNavToHere = function(idx) {
    if (!routeNavStops[idx]) return;
    routeNavTargetIdx = idx;
    // Highlight card
    document.querySelectorAll('.route-nav-card').forEach((c, i) => {
      if (i === idx) c.classList.add('fixed');
      else c.classList.remove('fixed');
    });
    document.getElementById('navStartBtn').textContent = '继续导航前往 ' + routeNavStops[idx].title;
    routeOpenNavSheet();
  };

  window.routeStartNav = function() {
    routeNavTargetIdx = routeNavTargetIdx || 0;
    if (!routeNavStops[routeNavTargetIdx]) return;
    routeOpenNavSheet();
  };

  function routeOpenNavSheet() {
    let stop = routeNavStops[routeNavTargetIdx];
    if (!stop) return;

    let dist = '';
    if (routeUserLoc) {
      let d = routeCalcDist(routeUserLoc.lat, routeUserLoc.lng, stop.lat, stop.lng);
      dist = '约 ' + d + ' · 步行';
    } else {
      dist = '步行约 15 分钟';
    }

    document.getElementById('navSheetTitle').textContent = '前往 ' + stop.title;
    document.getElementById('navSheetSubtitle').textContent = stop.location + ' · ' + dist;

    // Build map options
    let maps = routeGetMapOptions(stop);
    document.getElementById('navSheetMaps').innerHTML = maps.map(m =>
      '<div class="route-map-option" onclick="routeOpenMap(\'' + m.id + '\',' + routeNavTargetIdx + ')">' +
        '<div class="map-icon ' + m.iconClass + '">' + m.icon + '</div>' +
        '<div class="map-info">' +
          '<div class="map-name">' + m.name + '</div>' +
          '<div class="map-desc">' + m.desc + '</div>' +
        '</div>' +
        '<div class="map-arrow">&rarr;</div>' +
      '</div>'
    ).join('');

    document.getElementById('routeNavSheet').classList.add('show');
  }

  window.routeCloseNavSheet = function() {
    document.getElementById('routeNavSheet').classList.remove('show');
  };

  window.routeOpenMap = function(mapId, idx) {
    let stop = routeNavStops[idx];
    if (!stop) return;
    let name = encodeURIComponent(stop.title);
    let lat = stop.lat;
    let lng = stop.lng;
    let url = '';

    switch (mapId) {
      case 'amap':
        // 高德地图：to=name,lon,lat
        url = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + name + '&mode=walk&callnative=1';
        if (routeUserLoc) url += '&from=' + routeUserLoc.lng + ',' + routeUserLoc.lat + ',我的位置';
        break;
      case 'baidu':
        // 百度地图：需要 BD-09 坐标，这里做简单转换 (GCJ-02 → BD-09)
        let bd = routeGCJ2BD(lat, lng);
        url = 'https://api.map.baidu.com/direction?destination=name:' + name + '|latlng:' + bd.lat + ',' + bd.lng + '&coord_type=bd09ll&mode=walking&output=html&src=echoland';
        if (routeUserLoc) {
          let bdFrom = routeGCJ2BD(routeUserLoc.lat, routeUserLoc.lng);
          url += '&origin=name:我的位置|latlng:' + bdFrom.lat + ',' + bdFrom.lng;
        }
        break;
      case 'tencent':
        url = 'https://apis.map.qq.com/uri/v1/routeplan?type=walk&to=' + name + '&tocoord=' + lat + ',' + lng + '&referer=echoland';
        if (routeUserLoc) url += '&from=我的位置&fromcoord=' + routeUserLoc.lat + ',' + routeUserLoc.lng;
        break;
      case 'apple':
        url = 'https://maps.apple.com/?daddr=' + lat + ',' + lng + '&dirflg=w';
        if (routeUserLoc) url += '&saddr=' + routeUserLoc.lat + ',' + routeUserLoc.lng;
        break;
      case 'browser':
        url = 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '&travelmode=walking';
        if (routeUserLoc) url += '&origin=' + routeUserLoc.lat + ',' + routeUserLoc.lng;
        break;
    }

    if (url) {
      let a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    routeCloseNavSheet();
  };

  // GCJ-02 → BD-09 坐标转换
  function routeGCJ2BD(lat, lng) {
    let x = lng, y = lat;
    let z = Math.sqrt(x * x + y * y) + 0.00002 * Math.sin(y * Math.PI * 3000.0 / 180.0);
    let theta = Math.atan2(y, x) + 0.000003 * Math.cos(x * Math.PI * 3000.0 / 180.0);
    let bdLng = z * Math.cos(theta) + 0.0065;
    let bdLat = z * Math.sin(theta) + 0.006;
    return { lat: bdLat, lng: bdLng };
  }

  // 计算两点距离 (km)
  function routeCalcDist(lat1, lng1, lat2, lng2) {
    let R = 6371;
    let dLat = (lat2 - lat1) * Math.PI / 180;
    let dLng = (lng2 - lng1) * Math.PI / 180;
    let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
            Math.sin(dLng/2) * Math.sin(dLng/2);
    let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    let km = R * c;
    return km < 1 ? Math.round(km * 1000) + 'm' : km.toFixed(1) + 'km';
  }

  // 获取地图选项（根据平台智能排序）
  function routeGetMapOptions(stop) {
    let ua = navigator.userAgent;
    let isIOS = /iPhone|iPad|iPod/.test(ua);
    let isAndroid = /Android/.test(ua);
    let name = stop.title;

    let all = [
      { id: 'amap', name: '高德地图', desc: '路线规划、实时路况、步行导航', icon: '高', iconClass: 'amap' },
      { id: 'baidu', name: '百度地图', desc: '智能路线、全景地图、步行导航', icon: 'B', iconClass: 'baidu' },
      { id: 'tencent', name: '腾讯地图', desc: '微信生态、精准定位、步行导航', icon: 'T', iconClass: 'tencent' },
      { id: 'apple', name: 'Apple 地图', desc: '系统原生、流畅体验', icon: 'M', iconClass: 'apple' },
      { id: 'browser', name: '浏览器打开', desc: '无需安装 App，网页版地图', icon: 'W', iconClass: 'browser' }
    ];

    // 排序：iOS 优先 Apple → 高德 → 百度 → 腾讯 → 浏览器
    // Android 优先 高德 → 百度 → 腾讯 → 浏览器
    if (isIOS) {
      return [all[3], all[0], all[1], all[2], all[4]];
    } else if (isAndroid) {
      return [all[0], all[1], all[2], all[4]];
    }
    // 桌面端（开发调试）：显示全部
    return [all[3], all[0], all[1], all[2], all[4]];
  };

  // ====== COMMUNITY ======
  function renderCommunityRoutes() {
    let container = document.getElementById('routeCommunityCards');
    container.innerHTML = COMMUNITY_ROUTES.map(r =>
      '<div class="route-comm-card" onclick="routeUseCommunity(\'' + r.title + '\')">' +
        '<div class="route-comm-cover ' + r.coverClass + '" style="background:url(' + r.coverImage + ') center/cover no-repeat">' +
          '<div class="cover-users">' + r.users + '</div>' +
          '<div class="cover-title">' + r.title + '</div>' +
        '</div>' +
        '<div class="route-comm-body">' +
          '<div class="route-comm-meta">' +
            '<span>' + r.duration + '</span>' +
            '<span>' + r.cost + '</span>' +
            '<span>' + r.area + '</span>' +
          '</div>' +
          '<div class="route-comm-tags">' + r.tags.map(t => '<span>' + t + '</span>').join('') + '</div>' +
          '<div class="route-comm-footer">' +
            '<div class="route-comm-author"><div class="author-avatar">' + r.author.charAt(0) + '</div>' + r.author + '</div>' +
            '<button class="route-comm-use-btn" onclick="event.stopPropagation();routeUseCommunity(\'' + r.title + '\')">用这条</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    ).join('');
  }

  window.routeUseCommunity = function(title) {
    document.getElementById('routeNlInput').value = '参考路线：' + title;
    document.getElementById('routeNlInput').scrollIntoView({ behavior: 'smooth' });
    routeGenerate();
  };

  window.routeToggleCity = function() {
    let cities = ['南京', '北京', '上海', '杭州', '成都'];
    let el = document.querySelector('.route-city-name');
    let cur = el.textContent.trim();
    let idx = cities.indexOf(cur);
    el.textContent = cities[(idx + 1) % cities.length];
  };

  routeInit();
})();
</script>
